id: smoke.vpc
title: "VPC 화면 진입 스모크 (읽기 전용)"
service: "VPC"
category: "Networking"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Networking > VPC 를 열어 서비스에 진입한다"
    expect:
      url: "#/vpc/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 VPC 을(를) 클릭한다"
    expect:
      url: "#/vpc/vpc/list"
      text: ["VPC"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Subnet 을(를) 클릭한다"
    expect:
      url: "#/vpc/subnet/list"
      text: ["Subnet"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Port 을(를) 클릭한다"
    expect:
      url: "#/vpc/port/list"
      text: ["Port"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Internet Gateway 을(를) 클릭한다"
    expect:
      url: "#/vpc/internet-gateway/list"
