id: smoke.key-management-service
title: "Key Management Service 화면 진입 스모크 (읽기 전용)"
service: "Key Management Service"
category: "Security"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Security > Key Management Service 를 열어 서비스에 진입한다"
    expect:
      url: "#/kms/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 플랫폼 관리형 키 을(를) 클릭한다"
    expect:
      url: "#/kms/managedkms/list"
      text: ["플랫폼 관리형 키"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 고객 관리형 키 을(를) 클릭한다"
    expect:
      url: "#/kms/kms/list"
      text: ["고객 관리형 키"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
