    expect:
      url: "#/vpc/vpc-peering/list"
      text: ["VPC Peering"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Transit Gateway 을(를) 클릭한다"
    expect:
      url: "#/vpc/transit-gateway/list"
      text: ["Transit Gateway"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 PrivateLink Service 을(를) 클릭한다"
    expect:
      url: "#/vpc/privatelink-service/list"
