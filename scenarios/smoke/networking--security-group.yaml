id: smoke.security-group
title: "Security Group 화면 진입 스모크 (읽기 전용)"
service: "Security Group"
category: "Networking"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Networking > Security Group 를 열어 서비스에 진입한다"
    expect:
      url: "#/securitygroup/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Security Group 을(를) 클릭한다"
    expect:
      url: "#/securitygroup/securitygroup/list"
      text: ["Security Group"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Address Group 을(를) 클릭한다"
    expect:
      url: "#/securitygroup/addressgroup/list"
      text: ["Address Group"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Migration Rules 을(를) 클릭한다"
    expect:
      url: "#/securitygroup/migration-rules"
      text: ["Migration Rules"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
