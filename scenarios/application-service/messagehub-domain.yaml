id: application-service.messagehub-domain
title: Message Hub 발신 도메인 등록 후 삭제 (인증 없이)
service: Message Hub
category: Application Service
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-29 프로브, recordings/probe/messagehub-domain.md): 목록 #/messagehub/domain (메뉴 Email 관리 > Domain), 버튼 "Domain 추가" / 상단 "삭제"(행 선택 후).
# 폼 #/messagehub/domain/request: "Email 도메인"(소문자·숫자·- 3자 이상 + 최상위 도메인), 설명, 태그 → "완료" → "Domain을 추가하시겠습니까?" 확인.
# 등록 직후 인증 상태 "확인 필요": 도메인 소유 확인(DNS)은 별도 동작이라 하지 않는다 → 외부 인증·메일 없이 등록·삭제만 검증한다.
# 예약 도메인 example.com 의 하위 이름을 쓴다(RFC 2606). 무과금.
steps:
  - goal: "Domain 목록으로 이동한다"
    goto: "#/messagehub/domain"
    expect:
      url: "#/messagehub/domain"

  - goal: "도메인 {{name}} 을 등록한다"
    vars:
      name: "mhd-{{run_id}}.example.com"
    expect:
      url: "#/messagehub/domain"
      text: ["{{name}}", "확인 필요"]

teardown:
  - goal: "도메인 {{name}} 을 삭제한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 120000
