id: database.mariadb
title: VPC → Subnet → MariaDB(DBaaS) 단일 서버 생성 후 역순 해지
service: MariaDB(DBaaS)
category: Database
tags: [regression, destructive, crud, stack, heavy]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-28 프로브): PostgreSQL 폼과 같은 구조(서버명 prefix·클러스터명(영문만)·DATA GB·VPC/Subnet 공통 설정·Database명/사용자/비밀번호/포트·백업 등). 이미지 기본 MariaDB Community 11.4.
# 목록엔 해지 버튼이 없고 상세 "서비스 해지". 시간 과금 → 생성 확인 즉시 해지. 공유 VPC(SHARED_VPC/SHARED_SUBNET) 채택 가능.
steps:
  - goal: "VPC 목록으로 이동한다"
    goto: "#/vpc/vpc/list"
    expect:
      url: "#/vpc/vpc/list"

  - goal: "VPC {{vpc}} 와 Subnet {{subnet}} 을 만든다"
    vars:
      vpc: "vpc-{{run_id}}"
      subnet: "sub-{{run_id}}"
    expect:
      url: "#/vpc/subnet/list"
      text: ["{{subnet}}"]

  - goal: "MariaDB(DBaaS) 클러스터 {{name}} (서버 prefix {{prefix}}) 을 단일 서버로 생성하고 Active 를 기다린다"
    vars:
      name: "mac{{run_id_alpha}}"
      prefix: "a{{run_id_compact}}"
    expect:
      url: "#/mariadb/mariadb/list"
      text: ["{{name}}"]

  # 2026-09-30 추가(에이전트 C, API mariadbcreatereplica 202): 읽기 복제본. Master 는 백업을 켠 채 만든다(백업이 꺼져 있으면 Replica 요청이 500).
  # Master 상세 더보기 "Replica 구성" → "Replica 명"(소문자 시작, 3~19자) → 완료 → Replica 는 목록의 별도 행(Replica Cluster). 해지는 Master 와 같은 상세 "서비스 해지".
  - goal: "MariaDB 클러스터 {{name}} 에 읽기 복제본 {{replica}} 를 추가하고 Running 을 기다린다"
    vars:
      replica: "rep{{run_id_compact}}"
    expect:
      url: "#/mariadb/mariadb/list"
      text: ["{{replica}}", "{{name}}"]

  - goal: "복제본 {{replica}} 를 상세의 서비스 해지로 지우고 목록에서 사라질 때까지 기다린다"
    expect:
      url: "#/mariadb/mariadb/list"
      text: ["{{name}}"]
      not_text: ["{{replica}}"]
      timeout: 1800000

teardown:
  - goal: "상세의 서비스 해지로 클러스터 {{name}} 을 해지하고 목록에서 사라질 때까지 기다린다"
    expect:
      not_text: ["{{name}}"]
      timeout: 1800000
  - goal: "Subnet, VPC 를 지운다"
    expect:
      not_text: ["{{vpc}}"]
      timeout: 1200000
