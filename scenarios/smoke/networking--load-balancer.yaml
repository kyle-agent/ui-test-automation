id: smoke.load-balancer
title: "Load Balancer 화면 진입 스모크 (읽기 전용)"
service: "Load Balancer"
category: "Networking"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Networking > Load Balancer 를 열어 서비스에 진입한다"
    expect:
      url: "#/loadbalancer/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Load Balancer 을(를) 클릭한다"
    expect:
      url: "#/loadbalancer/loadbalancer/list"
      text: ["Load Balancer"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 LB 서버 그룹 을(를) 클릭한다"
    expect:
      url: "#/loadbalancer/loadbalancer-server-group/list"
      text: ["LB 서버 그룹"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 LB 헬스 체크 을(를) 클릭한다"
    expect:
      url: "#/loadbalancer/loadbalancer-health-check/list"
      text: ["LB 헬스 체크"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
