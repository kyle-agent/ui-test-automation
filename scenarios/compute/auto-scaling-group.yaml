id: compute.auto-scaling-group
title: VPC → Subnet → SG → Launch Configuration → Auto-Scaling Group(0대) 생성 후 역순 삭제
service: Virtual Server
category: Compute
tags: [regression, destructive, crud, stack]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-28 프로브): ASG 목록 #/virtualserver/auto-scaling-group/list, 버튼 "Auto-Scaling Group 생성" (목록에 삭제 없음 → 상세에서). 폼(…/request):
# 위쪽 Launch Configuration 표(행 선택), "Auto-Scaling Group명"(63자), "서버명"(61자, 뒤에 ## 붙음), "서버 수" Min/Desired/Max 입력,
# "Desired 서버 수 수동 설정"(체크), "네트워크 설정" VPC명/Subnet명 드롭다운, "Security Group"("선택" 모달), Load Balancer(선택 사항),
# Scale-out/Scale-in 정책("지금 설정"/"나중에 설정"), 상태 체크(Virtual Server 상태 확인 체크), 유예 기간 300, "요금 확인" → "생성".
# Min 0 / Desired 0 / Max 1 이면 서버가 만들어지지 않아 무과금.
steps:
  - goal: "VPC 목록으로 이동한다"
    goto: "#/vpc/vpc/list"
    expect:
      url: "#/vpc/vpc/list"

  - goal: "VPC {{vpc}}, Subnet {{subnet}}, Security Group {{sg}}, Launch Configuration {{lc}} 를 만든다"
    vars:
      vpc: "vpc-{{run_id}}"
      subnet: "sub-{{run_id}}"
      sg: "sg-{{run_id}}"
      lc: "lc-{{run_id}}"
    expect:
      url: "#/virtualserver/launch-configuration/list"
      text: ["{{lc}}"]

  - goal: "Auto-Scaling Group {{name}} 을 Min 0 / Desired 0 / Max 1 로 생성한다"
    vars:
      name: "asg-{{run_id}}"
    expect:
      url: "#/virtualserver/auto-scaling-group/list"
      text: ["{{name}}"]

teardown:
  - goal: "Auto-Scaling Group {{name}} 을 삭제한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 600000
  - goal: "Launch Configuration, Security Group, Subnet, VPC 를 역순으로 지운다"
    expect:
      not_text: ["{{vpc}}"]
      timeout: 1200000
