id: smoke.multi-node-gpu-cluster
title: "Multi-node GPU Cluster 화면 진입 스모크 (읽기 전용)"
service: "Multi-node GPU Cluster"
category: "Compute"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Compute > Multi-node GPU Cluster 를 열어 서비스에 진입한다"
    expect:
      url: "#/multinodegpucluster/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 GPU Node 을(를) 클릭한다"
    expect:
      url: "#/multinodegpucluster/gpu-node/list"
      text: ["GPU Node"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Cluster Fabric 을(를) 클릭한다"
    expect:
      url: "#/multinodegpucluster/cluster-fabric/list"
      text: ["Cluster Fabric"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
