id: devops-tools.devops-service
title: DevOps Service(Tenant) 생성 후 해지
service: DevOps Service
category: DevOps Tools
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-10-06 프로브): 목록 #/devopsservice/devops-service, 버튼 "서비스 생성". 목록 행에 삭제가 없고 상세(…/detail/info?devOpsServiceId=…) 상단 "서비스 해지".
# 폼: "Tenant명"·"Tenant 코드"(둘 다 영문 소문자로 시작, 소문자·숫자·- 3~30자), 신청자(본인)가 기본 멤버, 멤버 추가(선택). 요금 확인 버튼 없음.
# 생성 확인 "DevOps Service를 생성하시겠습니까?" → 수 초 뒤 Active. 해지 확인 "Tenant명: <이름> DevOps Service를 해지하시겠습니까?" → 수십 초 안에 사라짐.
# API 자동화는 createdevopsservice 409(not-found-admin-user-service)였으나 콘솔에서는 생성된다. 계정당 1개 한도(API 메모).
steps:
  - goal: "DevOps Service 목록으로 이동한다"
    goto: "#/devopsservice/devops-service"
    expect:
      url: "#/devopsservice/devops-service"

  - goal: "Tenant {{name}} (코드 {{code}}) 를 생성한다"
    vars:
      name: "dev-{{run_id}}"
      code: "devc-{{run_id}}"
    expect:
      url: "#/devopsservice/devops-service"
      text: ["{{name}}"]

teardown:
  - goal: "DevOps Service {{name}} 을 상세에서 해지한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 180000
