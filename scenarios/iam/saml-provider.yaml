id: iam.saml-provider
title: IAM 자격 증명 공급자(SAML) 생성 후 삭제
service: Identity and Access Management(IAM)
category: Management
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-10-06 프로브): 목록 #/iam/idp/list (Global), 버튼 "자격 증명 공급자 생성" / 상단 "삭제"(행 선택 후).
# 폼 #/iam/idp/create: "자격 증명 공급자명"(영문·숫자·._- 128자), 설명, 유형(SAML/OIDC), 메타데이터(UTF-8 xml 1개, 10MB, 파일첨부).
# 메타데이터는 spec 이 즉석에서 만드는 더미(example.invalid 엔드포인트). 이 공급자를 신뢰하는 역할을 만들지 않으므로 로그인 연동에 영향 없음.
steps:
  - goal: "자격 증명 공급자 목록으로 이동한다"
    goto: "#/iam/idp/list"
    expect:
      url: "#/iam/idp/list"

  - goal: "SAML 자격 증명 공급자 {{name}} 을 더미 메타데이터로 생성한다"
    vars:
      name: "saml-{{run_id}}"
    expect:
      url: "#/iam/idp/list"
      text: ["{{name}}"]

  - goal: "상세에서 설명을 edited {{run_id}} 로 수정한다"
    expect:
      text: ["edited {{run_id}}"]

  - goal: "메타데이터를 entityID 가 다른 더미 문서로 교체한다"

teardown:
  - goal: "자격 증명 공급자 {{name}} 을 삭제한다"
    expect:
      not_text: ["{{name}}"]
