id: smoke.secrets-manager
title: "Secrets Manager 화면 진입 스모크 (읽기 전용)"
service: "Secrets Manager"
category: "Security"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Security > Secrets Manager 를 열어 서비스에 진입한다"
    expect:
      url: "#/secretsmanager/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Secrets Manager 을(를) 클릭한다"
    expect:
      url: "#/secretsmanager/secretsmanager/list"
      text: ["Secrets Manager"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
