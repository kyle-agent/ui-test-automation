id: networking.vpc.create-delete
title: VPC 생성 후 삭제
service: VPC
category: Networking
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 과금/실리소스 시나리오. 이름은 {{run_id}} 로 고유하게 짓고 teardown 이 반드시 지운다.
# CI 기본 실행에서는 destructive 태그 때문에 제외되고 RUN_DESTRUCTIVE=1 일 때만 돈다.
steps:
  - goal: "VPC 목록 화면으로 이동한다"
    goto: "#/vpc/vpc/list"
    expect:
      url: "#/vpc/vpc/list"
      text: ["VPC"]
      not_text: ["오류가 발생", "권한이 없습니다"]

  - goal: "VPC 생성 버튼을 눌러 생성 화면을 연다"
    expect:
      title_contains: "생성"
      text: ["VPC"]

  - goal: "VPC 이름에 {{name}} 을 입력하고, IP 대역(CIDR)이 필요하면 {{cidr}} 를 입력하고, 나머지는 기본값으로 두고 생성 버튼을 눌러 생성을 완료한다"
    vars:
      name: "qa-vpc-{{run_id}}"
      cidr: "10.250.0.0/16"
      description: "자동 테스트 {{run_id}}"
    expect:
      url: "#/vpc/vpc/list"
      text: ["{{name}}"]
      not_text: ["오류가 발생", "실패"]
      timeout: 60000

teardown:
  - goal: "VPC 목록 화면으로 이동한다"
    goto: "#/vpc/vpc/list"
    expect:
      url: "#/vpc/vpc/list"
      text: ["VPC"]

  - goal: "목록에서 {{name}} 을 선택하고 삭제 버튼을 누른 뒤, 확인 창이 뜨면 삭제를 확정한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 120000
