id: smoke.cloud-wan
title: "Cloud WAN 화면 진입 스모크 (읽기 전용)"
service: "Cloud WAN"
category: "Networking"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Networking > Cloud WAN 를 열어 서비스에 진입한다"
    expect:
      url: "#/cwan/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Cloud WAN Network 을(를) 클릭한다"
    expect:
      url: "#/cwan/network"
      text: ["Cloud WAN Network"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Segment 을(를) 클릭한다"
    expect:
      url: "#/cwan/segment"
      text: ["Segment"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Attachment 을(를) 클릭한다"
    expect:
      url: "#/cwan/attachment"
      text: ["Attachment"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Site VPN 을(를) 클릭한다"
    expect:
      url: "#/cwan/sitevpn"
      text: ["Site VPN"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
