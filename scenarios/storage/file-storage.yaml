id: storage.file-storage
title: File Storage 볼륨 생성 후 해지
service: File Storage
category: Storage
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-23 프로브): 목록 #/filestorage/filestorage/list, 버튼 "서비스 생성" / 상단 "서비스 해지"(행 선택 후).
# 폼: "볼륨명"(영문 소문자로 시작, 소문자·숫자·_ 로 3~21자; 실제 이름은 "입력값+6자리 UUID" 로 만들어진다 → 목록은 접두어로 찾는다),
# "볼륨 유형"(Single-AZ), "Availability Zone"(kr-west1-b), "디스크 유형"(HDD), "프로토콜"(NFS/CIFS 버튼; CIFS 는 비밀번호 필요 → NFS). 용량 과금(짧게 유지).
steps:
  - goal: "File Storage 목록으로 이동한다"
    goto: "#/filestorage/filestorage/list"
    expect:
      url: "#/filestorage/filestorage/list"

  - goal: "File Storage 볼륨 {{name}} 을 NFS 로 생성한다"
    vars:
      # 소문자·숫자·_ 만 허용 → run_id 의 '-' 를 쓸 수 없다. 정리 규칙과 맞추기 위해 fs_ 접두어 + run_id 의 숫자 부분만 쓴다.
      name: "fs_{{run_id_compact}}"
    expect:
      url: "#/filestorage/filestorage/list"
      text: ["{{name}}"]

teardown:
  - goal: "File Storage 볼륨 {{name}} 을 해지한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 300000
