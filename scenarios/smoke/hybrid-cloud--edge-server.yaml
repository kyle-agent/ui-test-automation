id: smoke.edge-server
title: "Edge Server 화면 진입 스모크 (읽기 전용)"
service: "Edge Server"
category: "Hybrid Cloud"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Hybrid Cloud > Edge Server 를 열어 서비스에 진입한다"
    expect:
      url: "#/edgeserver/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Edge Server 을(를) 클릭한다"
    expect:
      url: "#/edgeserver/edgeserver/list"
      text: ["Edge Server"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
