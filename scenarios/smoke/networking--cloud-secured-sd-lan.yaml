id: smoke.cloud-secured-sd-lan
title: "Cloud Secured SD-LAN 화면 진입 스모크 (읽기 전용)"
service: "Cloud Secured SD-LAN"
category: "Networking"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Networking > Cloud Secured SD-LAN 를 열어 서비스에 진입한다"
    expect:
      url: "#/cssdlan/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Network 을(를) 클릭한다"
    expect:
      url: "#/cssdlan/cssdlan-network"
      text: ["Network"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
