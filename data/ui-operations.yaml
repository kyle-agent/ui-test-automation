  createcloudfunctioncronjobtrigger: compute.cloud-function
  createcloudfunctionapigatewaytrigger: application-service.api-gateway
  deletecloudfunctiontrigger: compute.cloud-function, application-service.api-gateway
  deletecloudfunction: compute.cloud-function
  updatecloudfunctioncronjobtrigger: compute.cloud-function
  updatecloudfunctionconfig: compute.cloud-function
  updatecloudfunctionurl: compute.cloud-function
  updatecloudfunctionvariables: compute.cloud-function
  updatecloudfunctioncode: compute.cloud-function
  setresourcepolicy: compute.cloud-function
  deleteresourcepolicy: compute.cloud-function
  updateprivatelinkservice: compute.cloud-function
  # 불가: createprivatelinkendpoint — 자기 함수의 PrivateLink Service ID 로 Endpoint 추가를 요청해도 목록에 나타나지 않음(2026-10-07). 다른 함수·계정의 Service 가 필요
  # 불가: requestprivatelinkendpoint — 위와 같은 이유로 승인할 연결 요청을 만들 수 없음
  # 불가: deleteprivatelinkendpoint — 위와 같은 이유로 지울 Endpoint 를 만들 수 없음

virtualserver:
  createkeypair: compute.vm-stack  # 확인 필요 — 공유 Keypair 가 없을 때만 생성
  deletekeypair: compute.vm-stack  # 확인 필요 — 이 실행에서 만든 경우만
  createvirtualserver: compute.vm-stack, compute.vm-stack-net, compute.vm-volume
  deletevirtualserver: compute.vm-stack, compute.vm-stack-net, compute.vm-volume
  stopvirtualserver: compute.vm-stack
  startvirtualserver: compute.vm-stack
  updatevirtualserver: compute.vm-stack  # 확인 필요 — 서버명 변경
  lockvirtualserver: compute.vm-stack
  unlockvirtualserver: compute.vm-stack
  attachvirtualserversecuritygroup: compute.vm-stack
  detachvirtualserversecuritygroup: compute.vm-stack  # 확인 필요 — "해제 가능하면 해제"
  createvirtualservercustomimage: compute.vm-stack
  updateimage: compute.vm-stack  # 확인 필요 — Visibility 를 Shared 로 변경(createsharingimage 일 수도)
  deleteimage: compute.vm-stack
  createserverinterface: compute.vm-stack
  deleteserverinterface: compute.vm-stack
  createvirtualserverdump: compute.vm-stack
  createserverinterfacenat: compute.vm-stack-net  # 확인 필요 — 서버 상세에서 예약 Public IP 연결
  createvolume: compute.vm-volume, compute.volume-snapshot
  deletevolume: compute.vm-volume, compute.volume-snapshot
  attachvolumetovirtualserver: compute.vm-volume  # 확인 필요 — 화면은 POST /servers/{id}/volumes(createservervolume) 경로를 부른다(10-07 6B)
  detachvolumefromvirtualserver: compute.vm-volume  # 확인 필요 — 화면은 DELETE /servers/{id}/volumes/{id}(deleteservervolume) 경로를 부른다(10-07 6B)
  createsnapshot: compute.volume-snapshot
  revertvolumetosnapshot: compute.volume-snapshot
  deletesnapshot: compute.volume-snapshot
  createvolumetransfer: compute.volume-snapshot
  deletevolumetransfer: compute.volume-snapshot  # 볼륨 이전 신청 취소 (DELETE /volume-transfer/{id}, 2026-10-07 6B 확인)
  createservergroup: compute.server-group
  deleteservergroup: compute.server-group
  createlaunchconfiguration: compute.launch-configuration, compute.auto-scaling-group
  deletelaunchconfiguration: compute.launch-configuration, compute.auto-scaling-group
  createautoscalinggroup: compute.auto-scaling-group
  deleteautoscalinggroup: compute.auto-scaling-group
  createautoscalinggrouppolicy: compute.auto-scaling-group
  deleteautoscalinggrouppolicy: compute.auto-scaling-group
  createautoscalinggroupschedule: compute.auto-scaling-group
  deleteautoscalinggroupschedule: compute.auto-scaling-group
  # 6차(2026-10-07 6B): 화면 요청 경로를 [API] 로그(src/console/api-log.ts)로 확인한 것
  updatevolume: compute.volume-snapshot  # 볼륨명 변경→되돌림 (PUT /volumes/{id})
  setvolumeqos: compute.volume-snapshot  # SSD_Provisioned Max IOPS·Throughput 수정 (PUT /volumes/{id}/qos)
  extendvolume: compute.volume-snapshot  # 용량 1→2 Units (PUT /volumes/{id}/size)
  updatesnapshot: compute.volume-snapshot  # 스냅샷 행 메뉴 "수정" 으로 설명 변경 (PUT /snapshots/{id})
  deleteserverinterfacenat: compute.vm-stack-net  # Public NAT IP 해제 (DELETE /servers/{id}/interfaces/{id}/static-nats/{id})
  rebootvirtualserver: compute.vm-stack-net  # 상세 "재시작" (POST /servers/{id}/reboot)
  setvirtualservertype: compute.vm-stack-net  # 중지 후 서버 타입 s1v1m2→s1v2m4 (POST /servers/{id}/server-type)
  updateserverinterface: compute.vm-stack-net  # 중지 상태에서 기본 포트 IP .50 → 원래 IP (PUT /servers/{id}/interfaces/{id}, 재부팅 동반)
  rebuildvirtualserver: compute.vm-stack-net  # 상세 더보기 "Rebuild" (POST /servers/{id}/rebuild, Rebuilding → Active)
  createservervolume: compute.vm-volume  # 서버 상세 Block Storage "추가" 로 볼륨 연결 — 화면 요청은 POST /servers/{id}/volumes (10-07 [API] 로그)
  deleteservervolume: compute.vm-volume  # 서버 상세에서 볼륨 분리(정리 단계) — DELETE /servers/{id}/volumes/{id}
  updateservervolume: compute.vm-volume  # 서버 상세 볼륨 행 선택 → "Delete on termination 수정" 미사용→사용→미사용 (PUT /servers/{id}/volumes/{id})
  updateautoscalinggroupservercount: compute.auto-scaling-group  # 상세 서버 수 Max 1→2→1 (PUT /auto-scaling-groups/{id}/server-count)
  updateautoscalinggroup: compute.auto-scaling-group  # 상세 상태 체크 유예 기간 300→600→300초 (PUT /auto-scaling-groups/{id})
  updateautoscalinggrouppolicy: compute.auto-scaling-group  # 정책 행 메뉴 "수정" Threshold 60→70% (PUT …/policies/{id})
  updateautoscalinggroupschedule: compute.auto-scaling-group  # 스케줄 행 메뉴 "수정" Max 1→2 (PUT …/schedules/{id})
  # 불가: acceptvolumetransfer — 볼륨 이전 받기는 다른 Account 에서 하고 승인 Key(비밀, 모달 "확인" 시 탭이 닫힘)가 필요
  # 불가: createimage — Image 목록 "Image 생성" 은 Object Storage 에 올린 qcow2 URL 필요(파일 업로드)
  # 불가: createimagemember — "다른 Account로 공유" 는 공유 대상 Account ID 필요(다른 계정)
  # 불가: deleteimagemember — 멤버 추가가 불가하므로 삭제 대상 없음(다른 계정)
  # 불가: createsharingimage — "공유용 Image 생성" 은 Visibility Private + Snapshot-Based Image 에서만 활성; 서버로 만든 Image 는 Image-Based (Snapshot-Based 를 만들 경로 미확인)
  # 불가: createautoscalinggroupnotification — 알림 수신자 후보(로그인 이력 있는 Account 멤버) 0명, 실제 사용자에게 메일/SMS
  # 불가: updateautoscalinggroupnotification — 알림 생성 불가로 대상 없음
  # 불가: deleteautoscalinggroupnotification — 알림 생성 불가로 대상 없음
  # 불가: updateautoscalinggrouplbservergroups — ASG 상세 Load Balancer 탭은 LB 서버 그룹(Load Balancer 상품) 필요, 이 spec 범위 밖

# ── Container ──
scr:
  createregistry: container.container-registry, container.repository
  deleteregistry: container.container-registry, container.repository
  updatepublicendpointenabled: container.container-registry  # 확인 필요 — 엔드포인트 프라이빗 ↔ 프라이빗&퍼블릭
  createrepository: container.repository
  deleterepository: container.repository
  updaterepositorypullpolicy: container.repository  # 상세 "이미지 pull 제한" 스캔되지 않은 이미지 pull 제한 켬→끔
  updaterepositoryscanpolicy: container.repository  # 상세 "이미지 스캔" 자동 스캔 켬→끔(빈 Repository 라 스캔 과금 없음)
  # 불가: updateprivateacl — 상세 "프라이빗 엔드포인트 접근 제어" 연필이 열리지 않음(2026-10-07 6D 프로브, 허용 리소스는 VPC 자원 선택 필요, 확인 필요)
  # 불가: updatepublicacl — 퍼블릭 엔드포인트를 켠 동안만 보이는 접근 제어. 이번엔 확인하지 못함(프라이빗 레지스트리 쿼터 1 · 실행 13분, 확인 필요)
  updaterepositorylifecyclepolicy: container.repository  # 확인 필요 — 이미지 태그 삭제 정책 켜기·끄기
  updaterepositorylockpolicy: container.repository
  updaterepositorydescription: container.repository

ske:
  createcluster: container.ske-cluster, container.ske-upgrade
  deletecluster: container.ske-cluster, container.ske-upgrade
  createnodepool: container.ske-cluster, container.ske-upgrade
  deletenodepool: container.ske-cluster, container.ske-upgrade
  setclusterupgrade: container.ske-upgrade
  setnodepoolupgrade: container.ske-upgrade
  setnodepool: container.ske-cluster # 노드 수 1→2→1 (2026-10-07)
  setnodepoollabels: container.ske-cluster # 레이블 추가→제거
  setnodepooltaints: container.ske-cluster # 테인트 추가→제거
  setclusterservicewatchlogging: container.ske-cluster # ServiceWatch 로그 수집 켬→끔 — 실측: PUT /v1/clusters/{id}/service-watch-logging (6E 10-13, setclusterlogging 아님)
  # 6E 10-13 (실측 경로)
  setclusterpublicaccesscontrol: container.ske-cluster  # 상세 "퍼블릭 엔드포인트" 연필 → 사용 체크(동의 체크 있는 경고 모달) + 접근 허용 IP 범위 203.0.113.1/32 → PUT /v1/clusters/{id}/public-access-control → 미사용으로 되돌림
  setclustersecuritygroups: container.ske-cluster  # 두 번째 SG(sgb-<run_id>) 를 "Security Group 선택" 모달(이름 검색 필요)에서 추가 → 제거
  setnodepoolpreferredips: container.ske-cluster  # 노드 풀 상세 "우선 IP 지정" 연필 → 사용 + 10.250.0.200 → PUT /v1/nodepools/{id}/preferred-ips → 제거
  # 불가: setclusterlogging — 콘솔 상세의 로그 연필은 "ServiceWatch 로그 수집" 하나뿐이고 그 경로가 …/service-watch-logging 이다(별도 logging 화면 없음)
  # 불가: setclusterdeletionprotection — 켜면 해지가 막혀 되돌리기 실패 시 정리가 불가(2026-10-07 결정, 테스트에서 켜지 않음)
  # 불가: setclusterprivateaccesscontrol — "접근 허용 자원" 모달은 Virtual Server·Bare Metal·GPU·DevOps 자원을 골라야 한다(이 spec 엔 서버가 없음)
  # 불가: setclusternfsvolume · setclusterlinkedresources · setnodepoollinkedresources — File Storage 볼륨·Object Storage 버킷 선행(다른 spec 의 자원, 체인 미구성)
  # 미실시: setclustersubnets — "추가 Subnet" 은 두 번째 Subnet 생성(2~4분)·삭제(최대 20분) 비용, 미착수
  # 네임스페이스 오브젝트 생성·삭제는 Kubernetes API(카탈로그 밖)라 대응 없음

