id: application-service.api-gateway
title: API Gateway API 생성 → 리소스·메서드 추가 → 스테이지 배포 → 해지
service: API Gateway
category: Application Service
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-29 프로브, recordings/probe/apigateway-api.md): 목록 #/apigateway/api, 버튼 "서비스 생성"(→ #/apigateway/api/request) / 행 끝 "서비스 해지"
# ("확인을 위해 삭제를 입력"). 폼: "API명"(영문 소문자로 시작, 소문자·숫자·- 3~50자, - 로 끝 불가), 생성 방법(새로 생성), 엔드포인트 유형(Region | Private).
# 생성 후 Creating → Active 약 3~4분. 리소스 화면 #/apigateway/resource: 제목 옆 API 드롭다운 + "조회"(API 가 하나면 자동 선택),
# 왼쪽 트리("/"), "리소스 생성" 모달(리소스명 소문자·숫자·-{} 3~50자, 경로 "/") → "생성 후에는 수정이 불가능합니다" 확인.
# 리소스 선택 → "메서드 생성" 모달: 메서드 유형(ANY·DELETE·GET…), 통합 유형 HTTP → 엔드포인트 URL(https://example.com) → 확인 → 확인.
# "API 배포" 모달: 스테이지명 "New Stage" + 신규 스테이지명 → "배포" → 확인 → 스테이지 화면 #/apigateway/stage 에 Active 배포.
# 해지는 스테이지·리소스를 따로 지우지 않아도 API 해지로 함께 사라진다(목록에서 바로 사라짐). 호출하지 않으므로 과금은 사실상 없음.
steps:
  - goal: "API 목록으로 이동한다"
    goto: "#/apigateway/api"
    expect:
      url: "#/apigateway/api"

  - goal: "Region API {{name}} 을 생성하고 Active 를 기다린다"
    vars:
      name: "apigw-{{run_id}}"
    expect:
      url: "#/apigateway/api"
      text: ["{{name}}", "Active"]

  - goal: "리소스 /items 를 만든다"
    expect:
      text: ["/items"]

  - goal: "/items 에 GET(HTTP https://example.com) 메서드를 만든다"
    expect:
      text: ["https://example.com"]

  - goal: "새 스테이지 {{stage}} 로 API 를 배포한다"
    vars:
      stage: "stg-{{run_id}}"
    expect:
      url: "#/apigateway/stage"
      text: ["{{stage}}", "Active"]

  # L3 2차 (2026-09-30, 에이전트 A): 인증 #/apigateway/authentication "JSON Web Token 생성" 모달(JWT명 · 만료 기간 31 Days · 연결할 스테이지 사용),
  # 접근 제어 #/apigateway/accessControl "접근 제어 생성" 모달(접근 제어명 · Public 접근 허용 IP(쉼표로 최대 100) · 연결할 스테이지 · 설명),
  # 사용량 정책 #/apigateway/usagePlan "사용량 정책 생성" → 화면 #/apigateway/usagePlan/request(연결할 API명 · 사용량 정책명 · 할당량 + 매월/매일/매시 · 설명) → "완료".
  # 세 목록 모두 제목 옆 API 드롭다운 + "조회", 삭제는 행 선택 → 표 위 "삭제".
  # 수정(2026-10-16, 에이전트 B): 인증·접근 제어·"연결된 API Key" 행 끝 ⋮(i.i-card-handle) → 메뉴 "수정 | 삭제" → 수정 모달 → 확인 → "…을 수정하시겠습니까?"
  # (setauth PUT /apis/{id}/auths/{id} · setaccesscontrol PUT …/access-controls/{id} · setapikeydescription PUT …/api-keys/{id}/description). docs/service-facts/application-service-api-gateway.md
  - goal: "JWT 인증 {{jwt}} 을 스테이지 {{stage}} 에 연결해 만들고, 수정으로 스테이지 연결을 끊은 뒤(연결 0) 지운다"
    vars:
      jwt: "jwt-{{run_id}}"
    expect:
      url: "#/apigateway/authentication"
      text: ["{{jwt}}"]

  - goal: "접근 제어 {{acl}} (허용 IP 192.0.2.0/24) 를 스테이지 {{stage}} 에 연결해 만들고, 수정으로 설명 qa {{run_id}} 를 넣은 뒤 지운다"
    vars:
      acl: "acl-{{run_id}}"
    expect:
      url: "#/apigateway/accessControl"
      text: ["{{acl}}"]

  - goal: "사용량 정책 {{plan}} (매일 100회) 과 API Key {{key}} 를 만들고, API Key 설명을 qa {{run_id}} 로 수정한 뒤 지운다"
    vars:
      plan: "plan-{{run_id}}"
      key: "key-{{run_id}}"
    expect:
      url: "#/apigateway/usagePlan"
      text: ["{{plan}}"]

  # Cloud Functions API Gateway 트리거 (2026-09-30, 에이전트 A 2차): 함수(Function명, Node.js 24 기본) → 상세 "트리거 추가" 모달
  # 트리거 종류 API Gateway → API명 → 스테이지명 → 확인 → "트리거를 추가하시겠습니까?". 트리거 탭 행 선택 → "삭제". 함수는 teardown 에서 API 보다 먼저 해지.
  - goal: "Cloud Function {{fn}} 에 API {{name}} · 스테이지 {{stage}} 로 API Gateway 트리거를 달고 지운다"
    vars:
      fn: "fn-{{run_id}}"
    expect:
      text: ["{{fn}}"]

  # 6차(2026-10-07, 에이전트 6D): 수정·삭제 동작. API setapidescription · setmethod · setstageconfiguration · setstageactivedeployment · deletemethod · deletestage
  - goal: "API 상세 설명을 수정한다"
    expect:
      url: "#/apigateway/api/detail"
      text: ["qa {{run_id}}"]

  - goal: "GET 메서드의 엔드포인트 URL 을 https://example.org 로 수정한다"
    expect:
      url: "#/apigateway/resource/method/detail"
      text: ["https://example.org"]

  - goal: "스테이지 {{stage}} 설명을 수정하고, 같은 스테이지로 다시 배포한 뒤 배포 변경으로 첫 배포를 활성으로 되돌린다"
    expect:
      url: "#/apigateway/stage"

  - goal: "GET 메서드 → 스테이지 {{stage}} 순서로 삭제한다"
    expect:
      url: "#/apigateway/stage"
      not_text: ["{{stage}}"]

  # 리소스 정책(2026-10-16, 에이전트 B): 화면 #/apigateway/resourcePolicy(API 드롭다운 + "조회"). API 생성 시 기본 정책(Sid DefaultStatement, Principal *, InvokeApigatewayRegion 허용)이
  # 이미 있어 "삭제 | 수정" 버튼이 보인다. "삭제" → "리소스 정책을 삭제하시겠습니까?" → DELETE /apis/{id}/resource-policies(deleteresourcepolicy) → "리소스 정책 생성" 버튼.
  # "리소스 정책 생성" → #/apigateway/resourcePolicy/request: 정책 템플릿(사용자 지정 | 기본 정책 | 계정 허용 목록 | IP 범위 거부 목록) + JSON 편집기 → "완료" → "리소스 정책을 생성하시겠습니까?"
  # → POST iam/resource-policies/validate → PUT /apis/{id}/resource-policies(setresourcepolicy). "수정" 화면(…/edit)은 내용을 바꿔야 "완료" 가 활성화되고 템플릿 자리표시자({{…}})가 남으면 검증 실패.
  - goal: "리소스 정책(기본 정책)을 삭제한 뒤 기본 정책 템플릿으로 다시 생성한다"
    expect:
      url: "#/apigateway/resourcePolicy"
      text: ["DefaultStatement"]

teardown:
  - goal: "API {{name}} 을 해지한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 120000
