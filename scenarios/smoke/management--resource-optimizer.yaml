id: smoke.resource-optimizer
title: "Resource Optimizer 화면 진입 스모크 (읽기 전용)"
service: "Resource Optimizer"
category: "Management"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Management > Resource Optimizer 를 열어 서비스에 진입한다"
    expect:
      url: "#/resourceoptimizer/home"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 대시보드 을(를) 클릭한다"
    expect:
      url: "#/resourceoptimizer/dashboard"
      text: ["대시보드"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Rightsizing 을(를) 클릭한다"
    expect:
      url: "#/resourceoptimizer/rightsizing"
      text: ["Rightsizing"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 유휴 자원 을(를) 클릭한다"
    expect:
      url: "#/resourceoptimizer/idle-resource"
      text: ["유휴 자원"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 기본 설정 을(를) 클릭한다"
    expect:
      url: "#/resourceoptimizer/settings"
      text: ["기본 설정"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
