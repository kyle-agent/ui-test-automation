id: smoke.virtual-server
title: "Virtual Server 화면 진입 스모크 (읽기 전용)"
service: "Virtual Server"
category: "Compute"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Compute > Virtual Server 를 열어 서비스에 진입한다"
    expect:
      url: "#/virtualserver/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Virtual Server 을(를) 클릭한다"
    expect:
      url: "#/virtualserver/virtualserver/list"
      text: ["Virtual Server"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Image 을(를) 클릭한다"
    expect:
      url: "#/virtualserver/image/list"
      text: ["Image"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Keypair 을(를) 클릭한다"
    expect:
      url: "#/virtualserver/keypair/list"
      text: ["Keypair"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Server Group 을(를) 클릭한다"
    expect:
      url: "#/virtualserver/server-group/list"
      text: ["Server Group"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Launch Configuration 을(를) 클릭한다"
    expect:
      url: "#/virtualserver/launch-configuration/list"
      text: ["Launch Configuration"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Auto-Scaling Group 을(를) 클릭한다"
    expect:
      url: "#/virtualserver/auto-scaling-group/list"
      text: ["Auto-Scaling Group"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Block Storage 을(를) 클릭한다"
    expect:
      url: "#/virtualserver/block-storage/list"
      text: ["Block Storage"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
