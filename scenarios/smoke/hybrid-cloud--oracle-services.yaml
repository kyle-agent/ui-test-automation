id: smoke.oracle-services
title: "Oracle Services 화면 진입 스모크 (읽기 전용)"
service: "Oracle Services"
category: "Hybrid Cloud"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Hybrid Cloud > Oracle Services 를 열어 서비스에 진입한다"
    expect:
      url: "#/oracleservices/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Oracle Services 을(를) 클릭한다"
    expect:
      url: "#/oracleservices/oracle-services"
      text: ["Oracle Services"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
