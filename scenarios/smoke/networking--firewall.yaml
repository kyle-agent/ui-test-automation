id: smoke.firewall
title: "Firewall 화면 진입 스모크 (읽기 전용)"
service: "Firewall"
category: "Networking"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Networking > Firewall 를 열어 서비스에 진입한다"
    expect:
      url: "#/firewall/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Firewall 을(를) 클릭한다"
    expect:
      url: "#/firewall/firewall/list"
      text: ["Firewall"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Migration Rules 을(를) 클릭한다"
    expect:
      url: "#/firewall/migration-rules"
      text: ["Migration Rules"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
