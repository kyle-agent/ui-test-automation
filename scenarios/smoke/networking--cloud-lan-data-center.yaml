id: smoke.cloud-lan-data-center
title: "Cloud LAN-Data Center 화면 진입 스모크 (읽기 전용)"
service: "Cloud LAN-Data Center"
category: "Networking"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Networking > Cloud LAN-Data Center 를 열어 서비스에 진입한다"
    expect:
      url: "#/clandc/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Cloud LAN Network 을(를) 클릭한다"
    expect:
      url: "#/clandc/network"
      text: ["Cloud LAN Network"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 vDevice 을(를) 클릭한다"
    expect:
      url: "#/clandc/device"
      text: ["vDevice"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Interface 을(를) 클릭한다"
    expect:
      url: "#/clandc/interface"
      text: ["Interface"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 vCable 을(를) 클릭한다"
    expect:
      url: "#/clandc/cable"
      text: ["vCable"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
