id: security.kms-key
title: KMS 고객 관리형 키 생성 후 즉시 해지
service: Key Management Service
category: Security
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-29 프로브, recordings/probe/kms-kms-list.md): 목록 #/kms/kms/list, 버튼 "서비스 생성" / 상단 "서비스 해지"(행 선택 후).
# 폼 #/kms/kms/request: "키명"(영문 소문자·숫자 3~63자 → '-' 불가라 kms<run_id_compact>), 용도(기본 AES-256), 자동 회전(기본 켜짐, 90일),
# 퍼블릭 접근 제어: 접근 허용 IP 가 필수(없으면 생성 비활성) → 문서용 대역 192.0.2.10/32 를 "추가", 프라이빗 접근 제어(기본 켜짐) 는 끈다.
# "요금 확인" 은 폼이 유효해도 "Field required" 알림만 띄워 누르지 않는다. 생성 확인 → 목록에 곧바로 Active.
# 해지 모달: 해지 방식 "즉시 해지"(기본) | "예약 해지". 즉시 해지는 동의 체크 후 확인 → 목록에서 바로 사라진다(삭제 예정 기간 없음).
steps:
  - goal: "KMS 키 목록으로 이동한다"
    goto: "#/kms/kms/list"
    expect:
      url: "#/kms/kms/list"

  - goal: "고객 관리형 키 {{name}} 을 AES-256 기본값으로 생성한다"
    vars:
      name: "kms{{run_id_compact}}"
    expect:
      url: "#/kms/kms/list"
      text: ["{{name}}"]

  # 동작(L3, 2026-10-06): 상세 상단 "키 회전"·"키 비활성화"/"키 활성화", 설명 연필, 태그 탭.
  - goal: "키 회전으로 현재 버전이 1 → 2 가 되는지 확인한다"
    expect:
      url: "#/kms/kms/detail"

  - goal: "키를 비활성화(Stop)했다가 다시 활성화(Active)한다"
    expect:
      url: "#/kms/kms/detail"
      text: ["키 비활성화"]

  - goal: "설명을 scp-console-tests {{run_id}} 로 수정한다"
    expect:
      url: "#/kms/kms/detail"
      text: ["scp-console-tests {{run_id}}"]

  - goal: "태그 탭에서 태그 qa-tag={{run_id}} 를 추가했다가 삭제한다"
    expect:
      url: "#/kms/kms/detail"
      text: ["태그 (0)"]

teardown:
  - goal: "키 {{name}} 을 즉시 해지한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 120000
