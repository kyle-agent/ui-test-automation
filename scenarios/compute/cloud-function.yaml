id: compute.cloud-function
title: Cloud Function 생성 후 해지
service: Cloud Functions
category: Compute
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-29 프로브): 목록 #/scf/cloudfunctions, 버튼 "서비스 생성" / 상단 "서비스 해지"(행 선택 후).
# 폼 #/scf/cloudfunctions/request: "Function명"(영문 소문자로 시작, 소문자·숫자·- 3~64자), Runtime "새로 작성" + Runtime & Version(기본 Node.js 24), 태그.
# L3(2026-09-29): 상세 "트리거 추가" 모달 → 트리거 종류 Cronjob → 분/시/일/월/요일 입력 5칸("* * * * *") + Timezone(기본 Asia/Seoul) → 확인 → "트리거를 추가하시겠습니까?".
#   트리거 탭 "트리거 (1)" 행 "cronjob|Asia/Seoul|* * * * *". 실행 확인은 로그 탭: 크론 호출 때 함수가 기동하며 "nodejs REST API running on port 8080!" (UTC 시각).
#   삭제는 트리거 탭 행 선택 → 표 위 "삭제" → "트리거를 삭제하시겠습니까?" → "트리거 1개 삭제가 성공하였습니다."
# 호출 단위 과금이라 만들고 바로 지우면 비용이 없다. 선행 리소스 없음.
steps:
  - goal: "Function 목록으로 이동한다"
    goto: "#/scf/cloudfunctions"
    expect:
      url: "#/scf/cloudfunctions"

  - goal: "Function {{name}} 을 새로 작성(Node.js 기본 런타임)으로 생성하고, Cronjob 트리거(매분)를 추가해 실행 로그를 확인한 뒤 트리거를 5분마다로 수정하고 삭제한다"
    vars:
      name: "fn-{{run_id}}"
    expect:
      url: "#/scf/cloudfunctions"
      text: ["{{name}}"]

  # 6차(2026-10-07, 에이전트 6D): 상세 "구성" 탭 하위 메뉴(일반 구성 · 함수 URL · 환경 변수 · Private 연결 구성 · 권한)와 "코드" 탭 수정.
  - goal: "구성 > 일반 구성에서 제한시간을 60초 → 90초로 바꿨다가 60초로 되돌린다"
    expect:
      url: "#/scf/cloudfunctions/detail"

  - goal: "구성 > 함수 URL 활성화를 사용으로 켰다가 미사용으로 끈다"
    expect:
      url: "#/scf/cloudfunctions/detail"

  - goal: "구성 > 환경 변수 QA_RUN 을 추가했다가 삭제한다"
    expect:
      url: "#/scf/cloudfunctions/detail"

  - goal: "코드 탭 인라인 편집기에서 주석 한 줄을 더해 저장하고 코드 탭에 반영됐는지 확인한다"
    expect:
      url: "#/scf/cloudfunctions/detail"

  - goal: "구성 > 권한에서 리소스 정책(템플릿 API Gateway 허용 목록)을 추가했다가 삭제한다"
    expect:
      url: "#/scf/cloudfunctions/detail"

  - goal: "구성 > Private 연결 구성에서 PrivateLink Service 를 사용으로 켰다가 미사용으로 끈다"
    expect:
      url: "#/scf/cloudfunctions/detail"

teardown:
  - goal: "Function {{name}} 을 해지한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 120000
