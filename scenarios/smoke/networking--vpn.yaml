id: smoke.vpn
title: "VPN 화면 진입 스모크 (읽기 전용)"
service: "VPN"
category: "Networking"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Networking > VPN 를 열어 서비스에 진입한다"
    expect:
      url: "#/vpn/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 VPN 을(를) 클릭한다"
    expect:
      url: "#/vpn/vpn/list"
      text: ["VPN"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 VPN Tunnel 을(를) 클릭한다"
    expect:
      url: "#/vpn/vpn-tunnel/list"
      text: ["VPN Tunnel"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
