id: application-service.queue
title: Queue 생성 후 해지
service: Queue Service
category: Application Service
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-29 프로브): 목록 #/queueservice/queueservices, 버튼 "서비스 생성" / 상단 "서비스 해지"(행 선택 후).
# 폼 #/queueservice/request: 유형(기본/FIFO, 기본값 유지), "Queue명"(영문 소문자로 시작, 소문자·숫자·- 3~64자), 설명(100자),
# 메시지 크기·보존 기간·전송 지연·표시 제한·수신 대기(기본값), 암호화 사용 안함, 리드라이브 모두 차단. 선행 리소스 없음.
steps:
  - goal: "Queue 목록으로 이동한다"
    goto: "#/queueservice/queueservices"
    expect:
      url: "#/queueservice/queueservices"

  # 2026-10-07 6차: 유형 FIFO(중복 제거 설정은 FIFO 에만 있다). FIFO Queue명은 ".fifo" 로 끝나야 해 실제 이름은 {{name}}.fifo.
  - goal: "Queue {{name}}.fifo 를 FIFO 유형·기본 설정으로 생성한다"
    vars:
      name: "que-{{run_id}}"
    expect:
      url: "#/queueservice/queueservices"
      text: ["{{name}}"]

  # 동작(L3, 2026-10-06): 상세 수정 아이콘과 IP 접근 허용 목록. 메시지 보내기/받기·purge 는 콘솔에 없다.
  - goal: "상세 메시지 설정에서 보존 기간을 4일 → 5일로 수정하고 상세에 반영됐는지 확인한다"
    expect:
      url: "#/queueservice/queueservices/detail"
      text: ["5일"]

  - goal: "IP 접근 허용 목록에 192.0.2.10/32 를 추가했다가 삭제한다"
    expect:
      url: "#/queueservice/queueservices/detail"
      not_text: ["192.0.2.10/32"]

  # 6차(2026-10-07): API updatequeuedescription · updatequeuededuplicationscope · updatequeuededuplication
  - goal: "설명을 수정하고, 중복 제거 범위를 그룹 단위의 메시지로 바꿨다 되돌리고, 컨텐츠 기반 중복 제거를 켰다 끈다"
    expect:
      url: "#/queueservice/queueservices/detail"
      text: ["scp-console-tests", "대기열 내 메시지"]

teardown:
  - goal: "Queue {{name}} 을 해지한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 120000
