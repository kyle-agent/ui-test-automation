id: smoke.simple-ai-inference
title: "Simple AI Inference 화면 진입 스모크 (읽기 전용)"
service: "Simple AI Inference"
category: "AI-ML"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 AI-ML > Simple AI Inference 를 열어 서비스에 진입한다"
    expect:
      url: "#/ai-inference/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 모델 카탈로그 을(를) 클릭한다"
    expect:
      url: "#/ai-inference/model-catalog/list"
      text: ["모델 카탈로그"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Serverless Inference 을(를) 클릭한다"
    expect:
      url: "#/ai-inference/serverless-endpoint/list"
      text: ["Serverless Inference"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 API 키 을(를) 클릭한다"
    expect:
      url: "#/ai-inference/apikey/list"
      text: ["API 키"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Playground 을(를) 클릭한다"
    expect:
      url: "#/ai-inference/playground"
      text: ["Playground"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
