# 커버리지 장부. 모집단은 service-map/screens.txt 의 "리소스 키가 붙은 목록 화면"(… | /x/y/list (key)) 이다.
# 검증·요약: npm run coverage (--md 로 Markdown). 형식과 level 의 뜻은 src/report/coverage.ts 머리말과 README "회귀 스택 스위트" 절.
#   level 0 없음 · 1 진입(스모크) · 2 CRUD(생성·확인·삭제, teardown 포함) · 3 동작(연결/분리·시작/중지·크기 변경) · 4 통합 의존 체인
#   key: resource_type 이 맵에서 유일하면 그대로, 겹치면 <resource_type>@<서비스 slug> (예: keypair@virtual-server)
#   specs: tests/regression/<id>.spec.ts 또는 시나리오 id (스모크는 smoke.<서비스 slug>). last_pass: 그 level 로 마지막 통과한 날짜(YYYY-MM-DD) 또는 null
# 갱신 규칙: spec 이 실제 콘솔에서 통과하면 그 spec 이 다루는 리소스의 level 을 올리고 specs 에 id 를 더하고 last_pass 를 그 날짜로 바꾼다.
