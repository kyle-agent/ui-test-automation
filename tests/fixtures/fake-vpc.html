<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Samsung Cloud Platform Console</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 24px;
      }
      header {
        display: flex;
        gap: 16px;
        align-items: center;
        margin-bottom: 16px;
      }
      iframe {
        width: 100%;
        height: 600px;
        border: 1px solid #ccc;
      }
    </style>
    <script src="fake-vpc-app.js"></script>
  </head>
  <body>
    <header>
      <strong>Samsung Cloud Platform Console</strong>
      <span>kr-west1</span>
      <span id="mode"></span>
    </header>
    <div id="shell"></div>
    <script>
      // 가짜 콘솔 셸. ?mode=plain(기본) | shadow | iframe 으로 micro-app 을 띄우는 세 가지 구조를 흉내 낸다.
      const mode = new URLSearchParams(location.search).get('mode') || 'plain';
      document.getElementById('mode').textContent = '(' + mode + ')';
      const shell = document.getElementById('shell');
      const hashHost = {
        setTitle: (t) => (document.title = t),
        setHash: (h) => (location.hash = h),
        getHash: () => location.hash,
        onHashChange: (fn) => window.addEventListener('hashchange', fn),
      };
      if (mode === 'shadow') {
        const wrapper = document.createElement('div');
        shell.appendChild(wrapper);
        const root = wrapper.attachShadow({ mode: 'open' });
        root.innerHTML = FAKE_VPC_MARKUP;
        mountFakeVpc(root, hashHost);
      } else if (mode === 'iframe') {
        const frame = document.createElement('iframe');
        frame.id = 'micro-app';
        frame.src = 'fake-vpc-app.html' + location.hash;
        shell.appendChild(frame);
        // micro-app 이 제목과 라우트를 알려 오면 셸이 반영한다. 셸의 hash 가 바뀌면 micro-app 에 전달한다.
        window.addEventListener('message', (e) => {
          if (e.data && e.data.type === 'title') document.title = e.data.title;
          if (e.data && e.data.type === 'hash' && location.hash !== e.data.hash) location.hash = e.data.hash;
        });
        window.addEventListener('hashchange', () =>
          frame.contentWindow.postMessage({ type: 'hash', hash: location.hash }, '*'),
        );
      } else {
        shell.innerHTML = FAKE_VPC_MARKUP;
        mountFakeVpc(document, hashHost);
      }
    </script>
  </body>
</html>
