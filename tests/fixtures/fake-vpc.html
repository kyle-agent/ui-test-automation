<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Samsung Cloud Platform Console</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 24px;
      }
      header {
        display: flex;
        gap: 16px;
        align-items: center;
        margin-bottom: 16px;
      }
      iframe {
        width: 100%;
        height: 600px;
        border: 1px solid #ccc;
      }
    </style>
    <script src="fake-vpc-app.js"></script>
  </head>
  <body>
    <header>
      <strong>Samsung Cloud Platform Console</strong>
      <span>kr-west1</span>
      <span id="mode"></span>
    </header>
    <div id="shell"></div>
    <script>
      // 가짜 콘솔 셸. ?mode=plain(기본) | shadow | iframe 으로 micro-app 을 띄우는 세 가지 구조를 흉내 낸다.
      const mode = new URLSearchParams(location.search).get('mode') || 'plain';
      document.getElementById('mode').textContent = '(' + mode + ')';
      const shell = document.getElementById('shell');
      const hashHost = {
        setTitle: (t) => (document.title = t),
        setHash: (h) => (location.hash = h),
        getHash: () => location.hash,
        onHashChange: (fn) => window.addEventListener('hashchange', fn),
      };
      if (mode === 'shadow') {
        const wrapper = document.createElement('div');
        shell.appendChild(wrapper);
        const root = wrapper.attachShadow({ mode: 'open' });
        root.innerHTML = FAKE_VPC_MARKUP;
        mountFakeVpc(root, hashHost);
      } else if (mode === 'iframe') {
        const frame = document.createElement('iframe');
        frame.id = 'micro-app';
        frame.src = 'fake-vpc-app.html' + location.hash;
        shell.appendChild(frame);
        // micro-app 이 제목과 라우트를 알려 오면 셸이 반영한다. 셸의 hash 가 바뀌면 micro-app 에 전달한다.
        window.addEventListener('message', (e) => {
          if (e.data && e.data.type === 'title') document.title = e.data.title;
          if (e.data && e.data.type === 'hash' && location.hash !== e.data.hash) location.hash = e.data.hash;
        });
        window.addEventListener('hashchange', () =>
          frame.contentWindow.postMessage({ type: 'hash', hash: location.hash }, '*'),
        );
      } else {
        shell.innerHTML = FAKE_VPC_MARKUP;
        mountFakeVpc(document, hashHost);
      }

      // ?shell=loader,notice : 실제 콘솔 셸이 화면 위에 얹는 것들을 흉내 낸다 (src/console/overlays.ts 가 걷어내는 대상).
      //  loader  진입 직후 1.2초 동안 전체 화면 .loader-overlay 를 띄우고 앱 루트를 [inert] 로 만든다.
      //  notice  .scp-modal.notice-info-container 공지 모달 (닫기 아이콘 .modal-header-icon, "확인" 버튼).
      const shellFlags = (new URLSearchParams(location.search).get('shell') || '').split(',');
      if (shellFlags.includes('loader')) {
        const loader = document.createElement('div');
        loader.className = 'loader-overlay is-fixed';
        loader.style.cssText =
          'position:fixed;inset:0;z-index:9999;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center';
        loader.textContent = '…';
        document.body.appendChild(loader);
        shell.setAttribute('inert', '');
        setTimeout(() => {
          loader.remove();
          shell.removeAttribute('inert');
        }, 1200);
      }
      if (shellFlags.includes('notice')) {
        const modal = document.createElement('div');
        modal.className = 'scp-modal notice-info-container';
        modal.style.cssText = 'position:fixed;inset:0;z-index:3010;background:rgba(0,0,0,.4)';
        modal.innerHTML =
          '<div style="background:#fff;margin:80px auto;width:640px;padding:16px">' +
          '<div style="display:flex;justify-content:space-between"><strong>공지 사항</strong>' +
          '<i class="modal-header-icon scp-icon i-del-s" style="cursor:pointer">✕</i></div>' +
          '<p>테스트용 공지 본문</p><label><input type="checkbox" /> 오늘 하루 보지 않기</label> ' +
          '<button class="scp-button" type="button">확인</button></div>';
        const close = () => modal.remove();
        modal.querySelector('.modal-header-icon').addEventListener('click', close);
        modal.querySelector('button').addEventListener('click', close);
        document.body.appendChild(modal);
      }
    </script>
  </body>
</html>
