id: smoke.block-storage-bm
title: "Block Storage(BM) 화면 진입 스모크 (읽기 전용)"
service: "Block Storage(BM)"
category: "Storage"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Storage > Block Storage(BM) 를 열어 서비스에 진입한다"
    expect:
      url: "#/baremetal-blockstorage/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Block Storage(BM) 을(를) 클릭한다"
    expect:
      url: "#/baremetal-blockstorage/baremetal-blockstorage/list"
      text: ["Block Storage(BM)"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Volume Group(BM) 을(를) 클릭한다"
    expect:
      url: "#/baremetal-blockstorage/volume-group/list"
      text: ["Volume Group(BM)"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
