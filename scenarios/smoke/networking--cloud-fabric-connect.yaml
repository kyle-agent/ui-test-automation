id: smoke.cloud-fabric-connect
title: "Cloud Fabric Connect 화면 진입 스모크 (읽기 전용)"
service: "Cloud Fabric Connect"
category: "Networking"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Networking > Cloud Fabric Connect 를 열어 서비스에 진입한다"
    expect:
      url: "#/cfc/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Fabric 을(를) 클릭한다"
    expect:
      url: "#/cfc/fabric"
      text: ["Fabric"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Port 을(를) 클릭한다"
    expect:
      url: "#/cfc/port"
      text: ["Port"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Connection 을(를) 클릭한다"
    expect:
      url: "#/cfc/connection"
      text: ["Connection"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Policy 을(를) 클릭한다"
    expect:
      url: "#/cfc/policy"
      text: ["Policy"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
