id: smoke.parallel-file-storage
title: "Parallel File Storage 화면 진입 스모크 (읽기 전용)"
service: "Parallel File Storage"
category: "Storage"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Storage > Parallel File Storage 를 열어 서비스에 진입한다"
    expect:
      url: "#/parallelfilestorage/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Parallel File Storage 을(를) 클릭한다"
    expect:
      url: "#/parallelfilestorage/parallelfilestorage/list"
      text: ["Parallel File Storage"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
