# ── Security ──
certificatemanager:
  selfsigncert: security.certificate  # 확인 필요 — 자체 발급 인증서 생성(createcertificate 일 수도)
  deletecertificate: security.certificate

kms:
  createkey: security.kms-key, security.secrets-manager
  # (security.secrets-manager 도 암호화 키 변경용으로 고객 키를 만들고 즉시 해지한다)
  rotatekey: security.kms-key
  changestatekey: security.kms-key
  updatedescription: security.kms-key
  changerotateinfo: security.kms-key  # 실측: 자동 회전 연필 회전 주기 90→60→90일 → PUT /v1/kms/transit/{id}/rotate-info (6C)
  deletekey: security.kms-key, security.secrets-manager  # 실측: 즉시 해지 → DELETE /v1/kms/transit/{id}?is_directly=True (6C)
  # 불가: encryptdata — 데이터 암·복호화·서명은 OpenAPI(/v1/kms/openapi/…) 전용, 콘솔 키 상세에는 키 회전·비활성화·해지·태그뿐
  # 불가: decryptdata — 위와 같음
  # 불가: datakey — 위와 같음
  # 불가: rewrapdata — 위와 같음
  # 불가: hmac — 위와 같음
  # 불가: signdata — 위와 같음
  # 불가: verifydata — 위와 같음

secretsmanager:
  createsecretsmanager: security.secrets-manager
  deletesecretsmanager: security.secrets-manager  # 실측: 7일 대기 해지 예약 → DELETE /v1/secrets/{id} (6C)
  restoresecretsmanager: security.secrets-manager  # 확인 필요 — 해지 취소
  setsecretdescription: security.secrets-manager  # 실측: 설명 연필 → PUT /v1/secrets/{id}/description (6C)
  setsecretaclcidr: security.secrets-manager  # 실측: 퍼블릭 접근 제어 연필 IP 추가 → PUT /v1/secrets/{id}/acl-cidr (6C)
  setkmsid: security.secrets-manager  # 실측: 고객 KMS 키를 만들어 암호화 키 변경 → 되돌림 → PUT /v1/secrets/{id}/kmsid (6C)
  # 불가: setprivateacl — 프라이빗 접근 제어 "사용" 은 허용 리소스(VM 등)를 하나 이상 넣어야 저장된다(실측: 리소스 0 이면 확인이 안 닫힘)
  # 불가: updatesecretsmanagersecretvalue — 상세 "보기"(값 확인·수정)가 계정 비밀번호 확인 모달을 먼저 띄운다(자격 증명 입력 금지)
  # 불가: setsecretsmanagerlabel — 버전 탭 레이블은 칩 표시뿐, 콘솔에 레이블 수정 기능 없음(10-07 프로브)
  # 불가: generaterandompassword — 생성 폼 유형이 "일반 유형의 Secret" 하나뿐, 임의 비밀번호 생성 버튼 없음

# secretvault (Secret Vault)
  # 불가: createsecretvault — 비용(고정 요금) 문제로 이전에 제외
  # 불가: terminatedsecretvault — 위와 같음

# ── Storage ──
filestorage:
  createvolume: storage.file-storage, storage.file-storage-snapshot
  deletevolume: storage.file-storage, storage.file-storage-snapshot
  createsnapshot: storage.file-storage-snapshot
  deletesnapshot: storage.file-storage-snapshot
  createsnapshotschedule: storage.file-storage-snapshot  # 상세 "스냅샷" 연필 → 사용 체크(매일 23:00, 보관 5)
  setsnapshotschedule: storage.file-storage-snapshot  # 켠 상태에서 시각 23:00 → 22:00
  deletesnapshotschedule: storage.file-storage-snapshot  # 확인 필요 — "사용" 해제(미사용)가 스케줄 삭제 API 인지
  # 불가: restoresnapshot — 콘솔 스냅샷 행 메뉴는 "복구 볼륨 생성"(신규 볼륨 생성)뿐, 제자리 복구 버튼은 찾지 못함(2026-10-07 6D, 확인 필요)
  # 불가: setaccessrule — 상세 "연결 자원" 은 Virtual Server·GPU·Bare Metal 을 골라야 함(이 spec 엔 서버가 없고 VPC·서버 생성 필요)
  # 불가: setvolume — file_unit_recovery_enabled(파일 단위 복구) 설정이 콘솔 상세에 없음(수정 가능 항목: 암호화·스냅샷·연결 자원·VPC Endpoint)
  # 불가: createvolumereplication · setvolumereplication · deletevolumereplication — 복제 위치가 다른 리전(kr-east1)만 가능(리전간 전송 요금)

# 대응 API 서비스가 없는 화면 spec(동작 지표 밖): Cloud Fabric Connect, Cloud LAN-Data Center, Cloud WAN, Notification Manager,
# Object Storage(버킷·폴더·업로드·버전 관리) — API 카탈로그에 해당 서비스가 없다.
