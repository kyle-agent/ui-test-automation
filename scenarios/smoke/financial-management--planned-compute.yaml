id: smoke.planned-compute
title: "Planned Compute 화면 진입 스모크 (읽기 전용)"
service: "Planned Compute"
category: "Financial Management"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Financial Management > Planned Compute 를 열어 서비스에 진입한다"
    expect:
      url: "#/plannedcompute"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Planned Compute 을(를) 클릭한다"
    expect:
      url: "#/plannedcompute/planned-compute/list"
      text: ["Planned Compute"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Coverage 을(를) 클릭한다"
    expect:
      url: "#/plannedcompute/coverage/list"
      text: ["Coverage"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
