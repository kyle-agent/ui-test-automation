id: iam.user-group
title: IAM 사용자 그룹 생성 후 삭제
service: Identity and Access Management(IAM)
category: Management
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-23 프로브): 목록 #/iam/group/list (Global), 버튼 "사용자 그룹 생성" / 상단 "삭제"(행 선택 후).
# 폼: "사용자 그룹명"(한글·영문·숫자·+=,.@-_ 로 3~24자), "설명"(1,000자), 사용자·정책 선택(선택 사항). 선행 리소스 없음, 무과금.
steps:
  - goal: "사용자 그룹 목록으로 이동한다"
    goto: "#/iam/group/list"
    expect:
      url: "#/iam/group/list"

  - goal: "사용자 그룹 {{name}} 을 생성한다"
    vars:
      name: "grp-{{run_id}}"
    expect:
      url: "#/iam/group/list"
      text: ["{{name}}"]

teardown:
  - goal: "사용자 그룹 {{name}} 을 삭제한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 120000
