# 화면 회귀 시나리오 ↔ API 동작 대응표 (동작 단위 커버리지, 대시보드 "동작 UI x/m · API y/m")
#
# 모수(m): API 자동화 카탈로그(data/api-coverage.json services[].ops)의 "쓰기 동작"만.
#   쓰기 동작 = HTTP 메서드가 POST·PUT·PATCH·DELETE 이고, 이름(서비스 접두어를 뗀 것, 예 mysqllistclusters → listclusters)이
#   읽기 동사 list·show·check·get·query·validate·detail·download 로 시작하지 않는 것. GET 은 모두 읽기.
#   (코드: src/report/operations.ts isWriteOp · READ_VERB). 읽기 동작은 여기 적지 않는다(적어도 세지 않고 "모르는 동작" 경고).
# UI(x): 아래에 적힌 동작 = 회귀 spec(tests/regression/<id>.spec.ts)의 시나리오 단계가 화면에서 그 동작을 한다.
# API(y): API 저장소 verified_endpoints.json 에 있는 동작.
#
# 형식(줄 단위, 사람이 고친다):
#   <API 서비스 slug>:
#     <카탈로그 동작 이름>: <spec id>, <spec id>   # 확인 필요   ← 화면 동작과 API 동작의 대응이 확실치 않으면 이 주석
# 서비스 slug·동작 이름은 API 카탈로그 그대로(data/api-coverage.json). 상품 이름은 코드가 붙인다(API_SERVICE + OPS_PRODUCT_EXTRA).
# 기준: 2026-10-07 시나리오 단계 목표(goal) 문구. 조건부 단계(환경 변수로 건너뛸 수 있는 것)도 포함했다.
# 태그 탭 추가·삭제는 Resource Groups(resourcemanager)의 태그 API 로 보았다(확인 필요).
#
# 콘솔 전용 쓰기 동작(2026-10-14, 사용자 결정): 모수 밖. 여기 적지 않고 자동으로 센다 —
#   모든 spec 의 fixture(src/fixtures/test.ts)가 화면이 보낸 쓰기 요청 "METHOD /console/api/<svc>/v1/…/{id}" 를 실행 기록(reports/runs/*.json api_writes)에 남기고,
#   통과한 실행의 요청 중 카탈로그 경로(data/api-coverage.json ops[].path, API 저장소 api_catalog.json http_path)와 strict 하게 맞지 않는 것을
#   대시보드 "콘솔 전용 쓰기 동작" 표에 올린다(src/report/operations.ts consoleOnlyWrites). {…} 자리에 bulk 같은 글자가 온 느슨한 일치는 "?" 로 표시.
#   따라서 "불가/확인 필요" 주석에 "카탈로그에 없는 경로" 라고 적힌 동작(예 iam deletegroup 의 DELETE /groups/bulk)은 그 표에서 자동으로 보인다.

# ── Application Service ──
apigateway:
  createapi: application-service.api-gateway
  createresource: application-service.api-gateway
  createmethod: application-service.api-gateway
  createapideployment: application-service.api-gateway
  createstage: application-service.api-gateway  # 확인 필요 — "새 스테이지로 배포" 가 스테이지 생성 API 를 따로 부르는지
  createauth: application-service.api-gateway
  deleteauth: application-service.api-gateway
  createaccesscontrols: application-service.api-gateway
  deleteaccesscontrol: application-service.api-gateway
  createusageplan: application-service.api-gateway
  deleteusageplan: application-service.api-gateway
  createapikey: application-service.api-gateway
  deleteapikey: application-service.api-gateway
  deleteapi: application-service.api-gateway
  setapidescription: application-service.api-gateway
  setmethod: application-service.api-gateway  # 메서드 수정 모달 엔드포인트 URL
  setstageconfiguration: application-service.api-gateway  # 스테이지 수정(설명)
  setstageactivedeployment: application-service.api-gateway  # 같은 스테이지 재배포 뒤 "배포 변경"으로 첫 배포 활성
  deletemethod: application-service.api-gateway
  deletestage: application-service.api-gateway
  setusageplandescription: application-service.api-gateway
  setusageplanquota: application-service.api-gateway
  # 불가: deleteresource — 메서드·스테이지를 지워도 리소스 상세 "삭제" 버튼이 비활성(2026-10-07 6D, 확인 필요). API 해지로 함께 지워짐
  # 불가: setauth · setaccesscontrol — 인증(JWT)·접근 제어 목록 행에 수정 버튼·상세 화면이 없음(행: 선택칸·이름·개수·일시만, 2026-10-07)
  # 불가: setapikeydescription — 사용량 정책 상세 "연결된 API Key" 행에 수정 동작 없음(복사하기 버튼뿐)
  # 불가: setresourcepolicy · deleteresourcepolicy — API Gateway 콘솔(API·리소스·스테이지·인증·접근 제어·사용량 정책)에 리소스 정책 화면을 찾지 못함(확인 필요)
  # 불가: createprivatelinkendpoint · setprivatelinkendpoint · deleteprivatelinkendpoint — Private 엔드포인트 유형 API + 다른 VPC 의 PrivateLink Endpoint 가 필요(API 상세 "연결 관리" 는 요청 승인용)

messagehub:
  createdomain: application-service.messagehub-domain
  deletedomain: application-service.messagehub-domain
  createemail: application-service.messagehub-email
  deleteemail: application-service.messagehub-email

queueservice:
  createqueue: application-service.queue
  updatequeueconfig: application-service.queue  # 확인 필요 — 메시지 설정(보존 기간) 수정
  setacl: application-service.queue
  deleteacl: application-service.queue
  deletequeue: application-service.queue
  updatequeuedescription: application-service.queue
  updatequeuededuplicationscope: application-service.queue  # FIFO Queue 상세 "중복 제거 범위"
  updatequeuededuplication: application-service.queue  # FIFO Queue 상세 "컨텐츠 기반 중복 제거"

# ── Compute ──
scf:
