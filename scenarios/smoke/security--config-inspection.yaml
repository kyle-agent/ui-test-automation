id: smoke.config-inspection
title: "Config Inspection 화면 진입 스모크 (읽기 전용)"
service: "Config Inspection"
category: "Security"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Security > Config Inspection 를 열어 서비스에 진입한다"
    expect:
      url: "#/configinspection/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Config Inspection 을(를) 클릭한다"
    expect:
      url: "#/configinspection/configinspection/list"
      text: ["Config Inspection"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 대시보드 을(를) 클릭한다"
    expect:
      url: "#/configinspection/configinspection-report/reportDashboard"
      text: ["대시보드"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 진단 결과 을(를) 클릭한다"
    expect:
      url: "#/configinspection/configinspection-report/history"
      text: ["진단 결과"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
