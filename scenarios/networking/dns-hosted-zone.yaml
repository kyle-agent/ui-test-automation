id: networking.dns-hosted-zone
title: Private DNS → Hosted Zone(Private) 생성 후 역순 삭제
service: DNS
category: Networking
tags: [regression, destructive, crud, stack]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-23 프로브): Hosted Zone 목록 #/dns/hosted-zone/list, 버튼 "Hosted Zone 생성" / 행 끝 "삭제". 폼: "용도구분"(Private/Public 버튼),
# "등록할 Private DNS명"(드롭다운, Private 일 때), "등록할 Hosted Zone명"(입력 + TLD 드롭다운 기본 .com + "사용 가능 여부 조회" 를 눌러야 "생성" 활성), "설명".
# 목록의 Hosted Zone명은 "<입력>.com" 이 된다. 생성 모달 "Hosted Zone을 생성하시겠습니까?", 삭제 모달 "Hosted Zone명 : … 삭제하시겠습니까?". 상태 Active 즉시.
# 선행: Private DNS(Creating 3~5분 → Active). Private DNS 는 상세의 "서비스 해지" 로만 지운다.
steps:
  - goal: "Private DNS 목록으로 이동한다"
    goto: "#/dns/private-dns/list"
    expect:
      url: "#/dns/private-dns/list"

  - goal: "Private DNS {{pdns}} 를 생성하고 Active 를 기다린다"
    vars:
      pdns: "pdns-{{run_id}}"
    expect:
      url: "#/dns/private-dns/list"
      text: ["{{pdns}}"]

  - goal: "Hosted Zone {{name}} 을 Private 용도로 {{pdns}} 에 생성한다 (.com, 사용 가능 여부 조회 후 생성)"
    vars:
      name: "hz-{{run_id}}"
      zone: "hz-{{run_id}}.com"
    expect:
      url: "#/dns/hosted-zone/list"
      text: ["{{zone}}"]

teardown:
  - goal: "Hosted Zone {{zone}} 을 행의 삭제 버튼으로 지운다"
    expect:
      not_text: ["{{zone}}"]
      timeout: 300000
  - goal: "상세 화면의 서비스 해지로 Private DNS {{pdns}} 를 해지한다"
    expect:
      not_text: ["{{pdns}}"]
      timeout: 300000
