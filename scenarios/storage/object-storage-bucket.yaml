id: storage.object-storage-bucket
title: Object Storage 버킷 생성 후 해지
service: Object Storage
category: Storage
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-23 프로브): 목록 #/objectstorage/objectstorage/list, 버튼 "서비스 생성" / 상단 "서비스 해지"(행 선택 후).
# 폼: "버킷명"(소문자·숫자로 시작, 소문자·숫자·-. 로 3~63자, 마침표 연속·마침표-대시 인접·마침표/대시로 끝 불가). 인증키(IAM > My Info > 인증키)가 없으면 "사용할 수 있는 인증키가 없습니다" 로 생성 불가 — 2026-09-23 영구 인증키 1개 생성해 둠.
# 선행 리소스 없음. 빈 버킷은 과금 없음.
steps:
  - goal: "Object Storage 목록으로 이동한다"
    goto: "#/objectstorage/objectstorage/list"
    expect:
      url: "#/objectstorage/objectstorage/list"

  - goal: "버킷 {{name}} 을 생성한다"
    vars:
      name: "bkt-{{run_id}}"
    expect:
      url: "#/objectstorage/objectstorage/list"
      text: ["{{name}}"]

  # 동작(L3, 2026-10-06): 폴더 리스트 탭(새폴더·파일 업로드·삭제), 상세 "버전 관리" 연필, 태그 탭.
  - goal: "폴더 qa-folder 를 만들고 작은 텍스트 파일 qa-upload.txt 를 올린 뒤 둘 다 삭제한다"
    expect:
      url: "#/objectstorage/objectstorage/detail/folder"
      not_text: ["qa-upload.txt"]

  - goal: "버전 관리를 사용으로 바꿨다가 미사용으로 되돌린다"
    expect:
      url: "#/objectstorage/objectstorage/detail"
      text: ["미사용"]

  - goal: "태그 탭에서 태그 qa-tag={{run_id}} 를 추가했다가 삭제한다"
    expect:
      url: "#/objectstorage/objectstorage/detail"
      text: ["태그 (0)"]

teardown:
  - goal: "버킷 {{name}} 을 해지한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 180000
