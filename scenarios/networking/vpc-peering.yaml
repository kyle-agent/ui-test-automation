id: networking.vpc-peering
title: VPC 2개 → VPC Peering 생성 → 규칙 추가·삭제 → 역순 삭제
service: VPC
category: Networking
tags: [regression, destructive, crud, stack]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-23 프로브): 목록 #/vpc/vpc-peering/list, 버튼 "VPC Peering 생성". 목록에는 행 선택·삭제가 없고 이름 링크 → 상세(#/vpc/vpc-peering/detail/info) 의
# "VPC Peering 삭제" 가 유일한 삭제 경로. 폼: "VPC Peering명"(20자), "요청 VPC명"(드롭다운), "승인 Account"(동일 Account/다른 Account 버튼), "승인 VPC명"(드롭다운), "설명".
# 동일 Account 면 승인 절차 없이 Creating → Active. 생성 모달 "VPC Peering을 생성하시겠습니까?". 무과금(전송량 과금만).
# 규칙(2026-09-30 프로브, 에이전트 B, API createvpcpeeringrule): 상세 "규칙 (n)" 탭(#/vpc/vpc-peering/detail/route) → "규칙 추가" 모달:
# 출발지(요청 VPC / 승인 VPC, 목적지는 자동), 목적지 IP 대역(목적지 VPC 대역 안, 안내문은 "Subnet 대역과 동일" 이지만 Subnet 없는 VPC 의 /24 도 받아들였다)
# → "입력하신 목적지 IP 대역으로 규칙을 추가하시겠습니까?" → Creating ≈20초 → Active (행: "요청 VPC 승인 VPC 10.250.16.0/24 …").
# 삭제: 행 선택 → 상단 "삭제" → "목적지: 승인 VPC / 목적지 IP 대역: … 규칙을 삭제하시겠습니까?" → Deleting ≈20초.
steps:
  - goal: "VPC 목록으로 이동한다"
    goto: "#/vpc/vpc/list"
    expect:
      url: "#/vpc/vpc/list"

  - goal: "요청 VPC {{vpc_a}} ({{cidr_a}}) 와 승인 VPC {{vpc_b}} ({{cidr_b}}) 를 생성한다"
    vars:
      vpc_a: "vpc-{{run_id}}"
      vpc_b: "vpcb-{{run_id}}"
      cidr_a: "10.250.0.0/20"
      cidr_b: "10.250.16.0/20"
    expect:
      url: "#/vpc/vpc/list"
      text: ["{{vpc_a}}", "{{vpc_b}}"]

  - goal: "VPC Peering {{name}} 을 동일 Account 로 {{vpc_a}} → {{vpc_b}} 사이에 생성하고 Active 를 기다린다"
    vars:
      name: "peer-{{run_id}}"
    expect:
      url: "#/vpc/vpc-peering/list"
      text: ["{{name}}"]

  - goal: "규칙 탭에서 요청 VPC → 승인 VPC 목적지 {{peer_dest}} 규칙을 추가하고 Active 를 기다린다"
    vars:
      peer_dest: "10.250.16.0/24"
    expect:
      url: "#/vpc/vpc-peering/detail/route"
      text: ["{{peer_dest}}"]

  - goal: "규칙 {{peer_dest}} 를 삭제한다"
    expect:
      url: "#/vpc/vpc-peering/detail/route"
      not_text: ["{{peer_dest}}"]

  # 동작(L3, 2026-10-13 6E, API setvpcpeering): 상세 정보 탭 "설명" 연필 → 반영 → 되돌림. approvalvpcpeering 은 다른 Account 승인이라 동일 Account 에선 나오지 않는다.
  - goal: "VPC Peering {{name}} 상세에서 설명을 바꿔 반영을 확인하고 되돌린다 (L3)"
    expect:
      url: "#/vpc/vpc-peering/detail"
      text: ["{{name}}"]

teardown:
  - goal: "상세 화면의 VPC Peering 삭제로 {{name}} 을 지운다"
    expect:
      not_text: ["{{name}}"]
      timeout: 300000
  - goal: "VPC {{vpc_a}} 와 {{vpc_b}} 를 해지한다"
    expect:
      not_text: ["{{vpc_a}}", "{{vpc_b}}"]
      timeout: 300000
