id: smoke.bare-metal-server
title: "Bare Metal Server 화면 진입 스모크 (읽기 전용)"
service: "Bare Metal Server"
category: "Compute"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Compute > Bare Metal Server 를 열어 서비스에 진입한다"
    expect:
      url: "#/baremetal/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Bare Metal Server 을(를) 클릭한다"
    expect:
      url: "#/baremetal/baremetal/list"
      text: ["Bare Metal Server"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
