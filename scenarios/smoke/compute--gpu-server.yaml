id: smoke.gpu-server
title: "GPU Server 화면 진입 스모크 (읽기 전용)"
service: "GPU Server"
category: "Compute"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Compute > GPU Server 를 열어 서비스에 진입한다"
    expect:
      url: "#/gpuserver/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 GPU Server 을(를) 클릭한다"
    expect:
      url: "#/gpuserver/gpuserver/list"
      text: ["GPU Server"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Image 을(를) 클릭한다"
    expect:
      url: "#/gpuserver/image/list"
      text: ["Image"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Keypair 을(를) 클릭한다"
    expect:
      url: "#/gpuserver/keypair/list"
      text: ["Keypair"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Block Storage 을(를) 클릭한다"
    expect:
      url: "#/gpuserver/block-storage/list"
      text: ["Block Storage"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
