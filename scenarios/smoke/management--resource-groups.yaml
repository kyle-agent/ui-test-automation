id: smoke.resource-groups
title: "Resource Groups 화면 진입 스모크 (읽기 전용)"
service: "Resource Groups"
category: "Management"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Management > Resource Groups 를 열어 서비스에 진입한다"
    expect:
      url: "#/resourcegroups"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Resource Groups 을(를) 클릭한다"
    expect:
      url: "#/resourcegroups/resource-group/list"
      text: ["Resource Groups"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
