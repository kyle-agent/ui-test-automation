id: compute.vm-stack
title: VPC → Subnet → Virtual Server 생성 후 역순 삭제
service: Virtual Server
category: Compute
tags: [regression, destructive, crud, stack]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 의존관계 (참조: kyle-agent/api-test-automation 의 knowledge/resource-dependencies.md, regression/scenarios/dependencies.json)
#   keypair → vpc(PUBLIC, /20) → subnet(PUBLIC, PRIMARY, VPC CIDR 의 하위 /24, ACTIVE 까지 ≈2분) → virtual server(ubuntu, s1v1m2, 볼륨 8의 배수, AZ kr-west1-b)
#   삭제는 역순: server 소멸 확인 → subnet 소멸 확인(30초~3분) → vpc → keypair.  Security Group 은 콘솔에서 선택 사항이라 넣지 않는다.
# 콘솔 제한: VPC명/Subnet명 3~20자(영문·숫자·-), 서버명 63자, Keypair명 255자. run_id 는 14자.
# 한도: 계정당 VPC 5개, VPC당 PRIMARY 서브넷 3개.
steps:
  - goal: "Keypair 목록으로 이동한다"
    goto: "#/virtualserver/keypair/list"
    expect:
      url: "#/virtualserver/keypair/list"

  # Keypair 는 무과금이고 생성 시 .pem 다운로드가 Edge 내부 페이지를 열어 로그인 브라우저를 불안정하게 만든다.
  # 그래서 고정 이름의 공유 Keypair 를 쓴다: 있으면 재사용(정리 때 남김), 없으면 생성(정리 때 삭제).
  - goal: "Keypair {{keypair}} 를 준비한다 (있으면 재사용, 없으면 SSH 로 생성)"
    vars:
      keypair: "qa-shared-keypair"
    expect:
      url: "#/virtualserver/keypair/list"
      text: ["{{keypair}}"]

  - goal: "VPC {{vpc}} 를 {{vpc_cidr}} 로 생성하고 Active 가 될 때까지 기다린다"
    vars:
      vpc: "vpc-{{run_id}}"
      vpc_cidr: "10.250.0.0/20"
    expect:
      url: "#/vpc/vpc/list"
      text: ["{{vpc}}"]
      not_text: ["오류가 발생", "실패"]

  - goal: "VPC {{vpc}} 에 Public/Primary Subnet {{subnet}} 을 {{subnet_cidr}} 로 생성하고 Active 가 될 때까지 기다린다"
    vars:
      subnet: "sub-{{run_id}}"
      subnet_cidr: "10.250.0.0/24"
    expect:
      url: "#/vpc/subnet/list"
      text: ["{{subnet}}"]
      not_text: ["오류가 발생", "실패"]
      timeout: 900000

  # 콘솔 목록의 서버 상태는 Block Device Mapping → Build → Active (≈1분). "Running" 이 아니라 "Active" 가 완료 상태다.
  - goal: "Ubuntu 이미지, Standard-1 / s1v1m2, SSD 볼륨으로 서버 {{vm}} 을 {{subnet}} 에 생성하고 Active 가 될 때까지 기다린다"
    vars:
      vm: "vm-{{run_id}}"
    expect:
      url: "#/virtualserver/virtualserver/list"
      text: ["{{vm}}"]
      not_text: ["오류가 발생", "실패"]
      timeout: 600000

  # 2026-09-28 추가(L3 동작): 목록에는 정지/시작 버튼이 없고 상세 화면 상단에 있다(실측 라벨은 실행 로그 "서버 상세 버튼" 참고).
  - goal: "서버 {{vm}} 을 상세 화면에서 정지하고 Stopped 가 된 뒤 다시 시작해 Active 로 돌아오는지 확인한다"
    expect:
      url: "#/virtualserver/virtualserver/list"
      text: ["{{vm}}"]

  # 2026-09-30 추가(에이전트 C): 서버 하위 리소스. API createvirtualservercustomimage(202)·updateimage·deleteimage / createserverinterface(200)·deleteserverinterface / createvirtualserverdump(202).
  # 상세 상단 버튼: 시작·중지·재시작·Image 생성·콘솔 로그·Dump 생성·서비스 해지. 네트워크 절: 신규/기존 네트워크 포트로 추가.
  - goal: "서버 {{vm}} 상세에서 커스텀 Image {{image}} 를 만들고 Active 를 기다린 뒤, Visibility 를 Shared 로 바꾸고 Image 를 삭제한다"
    vars:
      image: "img-{{run_id}}"
    expect:
      url: "#/virtualserver/image/list"
      not_text: ["{{image}}"]
      timeout: 300000

  - goal: "서버 {{vm}} 에 같은 Subnet 의 신규 네트워크 포트({{nic_ip}})를 추가하고 목록 IP 에 보이는지 확인한 뒤 삭제한다"
    vars:
      nic_ip: "10.250.0.200"
    expect:
      url: "#/virtualserver/virtualserver/list"
      text: ["{{vm}}"]
      not_text: ["{{nic_ip}}"]

  - goal: "서버 {{vm}} 상세에서 Dump 를 생성하고(파일은 서버 안에 생김, 다운로드 없음) 서버가 Active 로 남는지 확인한다"
    expect:
      url: "#/virtualserver/virtualserver/list"
      text: ["{{vm}}"]

teardown:
  - goal: "서버 {{vm}} 을 해지하고 목록에서 사라질 때까지 기다린다"
    expect:
      not_text: ["{{vm}}"]
      timeout: 600000

  # 서버를 담았던 서브넷은 Deleting 이 5분을 넘긴다 (실측 ≈6분, 모달 문구 "규모에 따라 수십 분").
  - goal: "Subnet {{subnet}} 을 삭제하고 목록에서 사라질 때까지 기다린다"
    expect:
      not_text: ["{{subnet}}"]
      timeout: 1200000

  - goal: "VPC {{vpc}} 를 해지하고 목록에서 사라질 때까지 기다린다"
    expect:
      not_text: ["{{vpc}}"]
      timeout: 180000

  - goal: "Keypair {{keypair}} 를 삭제한다 (이 실행에서 새로 만들었을 때만; 공유 Keypair 면 건너뜀)"
    expect:
      not_text: ["{{keypair}}"]
      timeout: 60000

  - goal: "(steps[6] 이 도중에 실패했을 때만) Image {{image}} 를 삭제한다 — 서버 해지보다 먼저 실행"
    expect:
      url: "#/virtualserver/image/list"
      not_text: ["{{image}}"]
      timeout: 300000
