id: smoke.gslb
title: "GSLB 화면 진입 스모크 (읽기 전용)"
service: "GSLB"
category: "Networking"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Networking > GSLB 를 열어 서비스에 진입한다"
    expect:
      url: "#/gslb/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 GSLB 을(를) 클릭한다"
    expect:
      url: "#/gslb/gslb/list"
      text: ["GSLB"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Regional Routing Controller 을(를) 클릭한다"
    expect:
      url: "#/gslb/rrc/list"
      text: ["Regional Routing Controller"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
