id: smoke.queue-service
title: "Queue Service 화면 진입 스모크 (읽기 전용)"
service: "Queue Service"
category: "Application Service"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Application Service > Queue Service 를 열어 서비스에 진입한다"
    expect:
      url: "#/queueservice/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Queue 을(를) 클릭한다"
    expect:
      url: "#/queueservice/queueservices"
      text: ["Queue"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
