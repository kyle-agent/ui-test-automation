id: smoke.notification-manager
title: "Notification Manager 화면 진입 스모크 (읽기 전용)"
service: "Notification Manager"
category: "Management"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Management > Notification Manager 를 열어 서비스에 진입한다"
    expect:
      url: "#/notification"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 알림 그룹 을(를) 클릭한다"
    expect:
      url: "#/notification/group"
      text: ["알림 그룹"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 알림 정책 을(를) 클릭한다"
    expect:
      url: "#/notification/policy"
      text: ["알림 정책"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
