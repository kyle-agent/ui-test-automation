id: container.repository
title: Registry 위에 Repository 생성 후 역순 삭제
service: Container Registry
category: Container
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-29 프로브): Repository 목록 #/scr/repository 은 제목 옆 레지스트리 드롭다운 + "조회" 로 레지스트리를 골라야 행이 보인다
# (레지스트리가 없으면 "선택된 Registry가 없어서 조회할 수 없습니다"). 생성 폼 #/scr/repository/request: 레지스트리(드롭다운),
# "리포지토리명"(소문자·숫자·- 3~30자, 시작과 끝은 소문자·숫자), 이미지 스캔·pull 제한·잠금·자동 삭제(모두 끔 기본).
# 선행: Container Registry (container.container-registry 와 같은 흐름, 생성 약 2.5분 · 해지 Terminating 약 2.5분).
steps:
  - goal: "Registry 목록으로 이동한다"
    goto: "#/scr/registry"
    expect:
      url: "#/scr/registry"

  - goal: "Registry {{registry}} 을 프라이빗 엔드포인트로 생성한다"
    vars:
      registry: "cr{{run_id_compact}}"
      name: "repo-{{run_id}}"
    expect:
      url: "#/scr/registry"
      text: ["{{registry}}"]

  - goal: "Registry {{registry}} 에 Repository {{name}} 을 기본 정책으로 생성한다"
    expect:
      url: "#/scr/repository"
      text: ["{{name}}"]

  # 동작(L3, 2026-10-06): Repository 상세 연필(이미지 태그 삭제 정책·이미지 잠금·설명)과 태그 탭.
  - goal: "이미지 태그 삭제 정책(Untagged Image 90일 + 삭제 정책 활성화)을 켰다가 끈다"
    expect:
      url: "#/scr/repository/detail"
      text: ["Untagged Image 자동 삭제 - 미사용"]

  - goal: "이미지 잠금 여부를 Lock 으로 바꿨다가 Unlock 으로 되돌린다"
    expect:
      url: "#/scr/repository/detail"
      text: ["Unlock"]

  - goal: "설명을 수정하고 태그 qa-tag={{run_id}} 를 추가했다가 삭제한다"
    expect:
      url: "#/scr/repository/detail"
      text: ["태그 (0)"]

  # 6차(2026-10-07, 6D): API updaterepositorypullpolicy · updaterepositoryscanpolicy
  - goal: "이미지 pull 제한(스캔되지 않은 이미지)과 이미지 자동 스캔을 켰다가 끈다"
    expect:
      url: "#/scr/repository/detail"
      text: ["미사용"]

teardown:
  - goal: "Repository {{name}} 을 삭제한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 60000
  - goal: "Registry {{registry}} 을 해지한다"
    expect:
      not_text: ["{{registry}}"]
      timeout: 60000
