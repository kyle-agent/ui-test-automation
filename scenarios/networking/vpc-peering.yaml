id: networking.vpc-peering
title: VPC 2개 → VPC Peering 생성 후 역순 삭제
service: VPC
category: Networking
tags: [regression, destructive, crud, stack]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-23 프로브): 목록 #/vpc/vpc-peering/list, 버튼 "VPC Peering 생성". 목록에는 행 선택·삭제가 없고 이름 링크 → 상세(#/vpc/vpc-peering/detail/info) 의
# "VPC Peering 삭제" 가 유일한 삭제 경로. 폼: "VPC Peering명"(20자), "요청 VPC명"(드롭다운), "승인 Account"(동일 Account/다른 Account 버튼), "승인 VPC명"(드롭다운), "설명".
# 동일 Account 면 승인 절차 없이 Creating → Active. 생성 모달 "VPC Peering을 생성하시겠습니까?". 무과금(전송량 과금만).
steps:
  - goal: "VPC 목록으로 이동한다"
    goto: "#/vpc/vpc/list"
    expect:
      url: "#/vpc/vpc/list"

  - goal: "요청 VPC {{vpc_a}} ({{cidr_a}}) 와 승인 VPC {{vpc_b}} ({{cidr_b}}) 를 생성한다"
    vars:
      vpc_a: "vpc-{{run_id}}"
      vpc_b: "vpcb-{{run_id}}"
      cidr_a: "10.250.0.0/20"
      cidr_b: "10.250.16.0/20"
    expect:
      url: "#/vpc/vpc/list"
      text: ["{{vpc_a}}", "{{vpc_b}}"]

  - goal: "VPC Peering {{name}} 을 동일 Account 로 {{vpc_a}} → {{vpc_b}} 사이에 생성하고 Active 를 기다린다"
    vars:
      name: "peer-{{run_id}}"
    expect:
      url: "#/vpc/vpc-peering/list"
      text: ["{{name}}"]

teardown:
  - goal: "상세 화면의 VPC Peering 삭제로 {{name}} 을 지운다"
    expect:
      not_text: ["{{name}}"]
      timeout: 300000
  - goal: "VPC {{vpc_a}} 와 {{vpc_b}} 를 해지한다"
    expect:
      not_text: ["{{vpc_a}}", "{{vpc_b}}"]
      timeout: 300000
