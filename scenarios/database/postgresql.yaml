id: database.postgresql
title: VPC → Subnet → PostgreSQL(DBaaS) 단일 서버 생성 후 역순 해지
service: PostgreSQL(DBaaS)
category: Database
tags: [regression, destructive, crud, stack, heavy]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-28 프로브): 목록 #/postgresql/postgresql/list, 버튼 "서비스 생성"(목록엔 해지 버튼 없음 → 상세 "서비스 해지"). 폼(#/postgresql/postgresql/request):
# 이미지(기본 PostgreSQL Community 최신), "서버명 prefix"(소문자·숫자·- 3~13자), "클러스터명"(영문만 3~20자 → 숫자 없는 run_id_alpha), 서비스 유형 Standard(db1)/db1v2m4 기본, Block Storage SSD 기본 + "DATA" 용량 GB 입력(기본 0 → 필수, 16 으로),
# "이중화 구성"(끔), 네트워크 "공통 설정": "VPC명"·"Subnet명" 드롭다운, IP 자동 생성, "Database명"(영문 3~20), "Database 사용자명"(소문자 2~20), 비밀번호 2회(8~30자, 특수문자 포함),
# "Database Port번호"(1200~), 백업·Audit·ServiceWatch(끔), Parameter/Encoding/Locale/시간대 기본, "요금 확인" → "생성". 비밀번호는 실행 중 만들고 어디에도 기록하지 않는다.
# 시간 과금 → 생성 확인 즉시 해지. 생성·해지 각각 10~20분.
steps:
  - goal: "VPC 목록으로 이동한다"
    goto: "#/vpc/vpc/list"
    expect:
      url: "#/vpc/vpc/list"

  - goal: "VPC {{vpc}} 와 Subnet {{subnet}} 을 만든다"
    vars:
      vpc: "vpc-{{run_id}}"
      subnet: "sub-{{run_id}}"
    expect:
      url: "#/vpc/subnet/list"
      text: ["{{subnet}}"]

  - goal: "PostgreSQL 클러스터 {{name}} (서버 prefix {{prefix}}) 을 단일 서버로 생성하고 Active 를 기다린다"
    vars:
      name: "pgc{{run_id_alpha}}"
      prefix: "p{{run_id_compact}}"
    expect:
      url: "#/postgresql/postgresql/list"
      text: ["{{name}}"]

  # 2026-09-30 추가(에이전트 C, API postgresqlcreatereplica 202): 읽기 복제본. Master 는 백업을 켠 채 만든다(백업이 꺼져 있으면 Replica 요청이 500).
  # Master 상세 더보기 "Replica 구성" → "Replica 명"(소문자 시작, 3~19자) → 완료 → Replica 는 목록의 별도 행(Replica Cluster). 해지는 Master 와 같은 상세 "서비스 해지".
  - goal: "PostgreSQL 클러스터 {{name}} 에 읽기 복제본 {{replica}} 를 추가하고 Running 을 기다린다"
    vars:
      replica: "rep{{run_id_compact}}"
    expect:
      url: "#/postgresql/postgresql/list"
      text: ["{{replica}}", "{{name}}"]

  - goal: "복제본 {{replica}} 를 상세의 서비스 해지로 지우고 목록에서 사라질 때까지 기다린다"
    expect:
      url: "#/postgresql/postgresql/list"
      text: ["{{name}}"]
      not_text: ["{{replica}}"]
      timeout: 1800000

  # 2026-10-07 6차(에이전트 6A): 상세 공통 동작. 코드상 Replica 단계(steps[3]·[4]) 보다 먼저 실행한다(src/console/dbaas.ts ops).
  # 서비스 상태 동기화 · 재시작 · 백업 켬(Replica 전제) · 유지 관리 기간 켬→끔 · Audit Log 켬→끔 · IP 접근 제어 추가→삭제 ·
  # Parameter 조회·cpu_tuple_cost 0.01→0.02→0.01 · Archive 조회·보관기간 3→4→3 · 중지→시작. 모두 Running 으로 돌아온다.
  - goal: "클러스터 {{name}} 상세에서 동기화·재시작·백업·유지 관리 기간·Audit Log·IP 접근 제어·Parameter·Archive·중지/시작을 하고 되돌린다"
    expect:
      url: "#/postgresql/postgresql/list"
      text: ["{{name}}"]

teardown:
  - goal: "상세의 서비스 해지로 클러스터 {{name}} 을 해지하고 목록에서 사라질 때까지 기다린다"
    expect:
      not_text: ["{{name}}"]
      timeout: 1800000
  - goal: "Subnet, VPC 를 지운다"
    expect:
      not_text: ["{{vpc}}"]
      timeout: 1200000
