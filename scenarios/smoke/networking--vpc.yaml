  - goal: "좌측 메뉴에서 Public IP 을(를) 클릭한다"
    expect:
      url: "#/vpc/public-ip/list"
      text: ["Public IP"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Private NAT 을(를) 클릭한다"
    expect:
      url: "#/vpc/private-nat/list"
