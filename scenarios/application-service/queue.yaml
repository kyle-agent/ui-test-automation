id: application-service.queue
title: Queue 생성 후 해지
service: Queue Service
category: Application Service
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-29 프로브): 목록 #/queueservice/queueservices, 버튼 "서비스 생성" / 상단 "서비스 해지"(행 선택 후).
# 폼 #/queueservice/request: 유형(기본/FIFO, 기본값 유지), "Queue명"(영문 소문자로 시작, 소문자·숫자·- 3~64자), 설명(100자),
# 메시지 크기·보존 기간·전송 지연·표시 제한·수신 대기(기본값), 암호화 사용 안함, 리드라이브 모두 차단. 선행 리소스 없음.
steps:
  - goal: "Queue 목록으로 이동한다"
    goto: "#/queueservice/queueservices"
    expect:
      url: "#/queueservice/queueservices"

  - goal: "Queue {{name}} 을 기본 유형·기본 설정으로 생성한다"
    vars:
      name: "que-{{run_id}}"
    expect:
      url: "#/queueservice/queueservices"
      text: ["{{name}}"]

teardown:
  - goal: "Queue {{name}} 을 해지한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 120000
