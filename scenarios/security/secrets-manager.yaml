id: security.secrets-manager
title: Secrets Manager 시크릿 생성 → 해지 예약 → 해지 취소 → 해지 예약
service: Secrets Manager
category: Security
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-29 프로브, recordings/probe/secretsmanager-secretsmanager-list.md): 목록 #/secretsmanager/secretsmanager/list,
# 버튼 "서비스 생성" / 상단 "서비스 해지"(행 선택 후). 폼: "Secret명"(영문·숫자·-_ 3~63자), 유형(일반), Key/Value 1쌍,
# 암호화 키(기본 관리형 키 "scp/secretsmanager" — KMS 키를 따로 만들 필요 없음), 퍼블릭 접근 허용 IP 필수(192.0.2.10/32), 프라이빗 접근 제어 끔.
# 해지는 즉시 삭제가 없고 "해지 대기 기간"(7~30일, 기본 30) 뒤 삭제된다 → 최소 7일로 예약하고 행 상태 "To be terminated" + 삭제 예정 일시로 확인.
# 상세의 "해지 취소" 를 누르면 Active 로 돌아온다(L3). 시크릿 값은 run_id 로 실행 중 만들고 기록하지 않는다.
steps:
  - goal: "Secrets Manager 목록으로 이동한다"
    goto: "#/secretsmanager/secretsmanager/list"
    expect:
      url: "#/secretsmanager/secretsmanager/list"

  - goal: "시크릿 {{name}} 을 기본 관리형 키로 생성한다"
    vars:
      name: "sec-{{run_id}}"
    expect:
      url: "#/secretsmanager/secretsmanager/list"
      text: ["{{name}}"]

  - goal: "시크릿 {{name}} 을 7일 대기로 해지 예약한다"
    expect:
      text: ["{{name}}", "To be terminated"]

  - goal: "상세에서 해지를 취소해 Active 로 되돌린다"
    expect:
      text: ["{{name}}"]

  # 6C(2026-10-07): 해지 취소로 Active 가 된 뒤 상세 연필 동작
  - goal: "설명을 scp-console-tests {{run_id}} 로 수정한다"
    expect:
      text: ["scp-console-tests {{run_id}}"]

  - goal: "퍼블릭 접근 허용 IP 192.0.2.11/32 를 추가한다"
    expect:
      text: ["192.0.2.11/32"]

  # 6C(2026-10-07): 암호화 키 변경(setkmsid) — 고객 KMS 키를 만들어 바꿨다가 기본 키로 되돌린다. 키는 teardown 에서 즉시 해지.
  - goal: "고객 관리형 KMS 키 {{kms}} 를 만든다"
    vars:
      kms: "kms{{run_id_compact}}"
    expect:
      url: "#/kms/kms/list"
      text: ["{{kms}}"]

  - goal: "시크릿 암호화 키를 {{kms}} 로 바꿨다가 scp/secretsmanager 로 되돌린다"
    expect:
      text: ["scp/secretsmanager"]

teardown:
  - goal: "시크릿 {{name}} 을 다시 7일 대기로 해지 예약한다 (목록에 To be terminated 로 남는다)"
    expect:
      text: ["{{name}}", "To be terminated"]
      timeout: 120000
  - goal: "KMS 키 {{kms}} 를 즉시 해지한다"
    expect:
      not_text: ["{{kms}}"]
      timeout: 120000
