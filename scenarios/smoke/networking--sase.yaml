id: smoke.sase
title: "SASE 화면 진입 스모크 (읽기 전용)"
service: "SASE"
category: "Networking"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Networking > SASE 를 열어 서비스에 진입한다"
    expect:
      url: "#/sase/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 SASE 서비스 을(를) 클릭한다"
    expect:
      url: "#/sase/sase"
      text: ["SASE 서비스"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 SASE Lastmile 을(를) 클릭한다"
    expect:
      url: "#/sase/last-mile/list"
      text: ["SASE Lastmile"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
