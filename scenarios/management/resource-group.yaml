id: management.resource-group
title: Resource Group 생성 후 삭제
service: Resource Groups
category: Management
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-23 프로브): 목록 #/resourcegroups/resource-group/list, 버튼 "Resource Group 생성" / 상단 "삭제"(행 선택 후).
# 폼: "Resource Group명"(한글·영문·숫자·+= ,.@-_ 로 3~64자), "설명"(1,000자), "자원 유형"(기본 전체), "그룹 정의 태그"(key/value 입력 후 "태그 추가"),
# "그룹 대상 자원"(자원 미리보기). 선행 리소스 없음, 무과금.
steps:
  - goal: "Resource Group 목록으로 이동한다"
    goto: "#/resourcegroups/resource-group/list"
    expect:
      url: "#/resourcegroups/resource-group/list"

  - goal: "Resource Group {{name}} 을 태그 qa={{run_id}} 로 생성한다"
    vars:
      name: "rg-{{run_id}}"
    expect:
      url: "#/resourcegroups/resource-group/list"
      text: ["{{name}}"]

  # 동작(L3, 2026-10-06): "그룹 자원 수정"(…/update/<id>) 으로 그룹 정의 태그 조건 추가·제거, "태그 수정"(…/tag/edit) 으로 그룹 태그 추가·삭제.
  - goal: "그룹 정의 태그 조건 qa2:{{run_id}} 를 추가해 저장하고 그룹 자원 탭에 조건 2개가 보이는지 확인한다"
    expect:
      url: "#/resourcegroups/resource-group/detail/"
      text: ["qa2:{{run_id}}", "qa:{{run_id}}"]

  - goal: "추가한 그룹 정의 태그 조건을 제거해 저장하고 조건 1개로 돌아갔는지 확인한다"
    expect:
      url: "#/resourcegroups/resource-group/detail/"
      not_text: ["qa2:{{run_id}}"]

  - goal: "태그 탭에서 태그 qa-tag={{run_id}} 를 추가했다가 삭제한다"
    expect:
      url: "#/resourcegroups/resource-group/detail/"
      text: ["태그 (0)"]

  # 6C(2026-10-07): 태그 2개 → 한 개 값 수정 → 하나씩 삭제 (태그 API 단건/일괄 관찰)
  - goal: "태그 qa-a·qa-b 를 추가하고 qa-a 값을 바꾼 뒤 하나씩 삭제한다"
    expect:
      url: "#/resourcegroups/resource-group/detail/"
      text: ["태그 (0)"]

  # agent C(2026-10-16): 여러 그룹 동시 삭제가 일괄 API(DELETE /v1/resource-groups, deleteresourcegroups)를 부르는지 — 그룹 2개를 더 만들어 한 번에 지운다(단건 삭제는 teardown 그대로).
  - goal: "Resource Group {{name_b}}·{{name_c}} 를 만들어 목록에서 둘을 한 번에 선택해 삭제한다"
    vars:
      name_b: "rg-b-{{run_id}}"
      name_c: "rg-c-{{run_id}}"
    expect:
      url: "#/resourcegroups/resource-group/list"
      not_text: ["{{name_b}}", "{{name_c}}"]
      timeout: 120000

teardown:
  - goal: "Resource Group {{name}} 을 삭제한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 120000
