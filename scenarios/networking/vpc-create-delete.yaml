id: networking.vpc.create-delete
title: VPC 생성 후 삭제
service: VPC
category: Networking
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 과금/실리소스 시나리오. 이름은 {{run_id}} 로 고유하게 짓고 teardown 이 반드시 지운다.
# CI 기본 실행에서는 destructive 태그 때문에 제외되고 RUN_DESTRUCTIVE=1 일 때만 돈다.
steps:
  - goal: "VPC 목록 화면으로 이동한다"
    goto: "#/vpc/vpc/list"
    expect:
      url: "#/vpc/vpc/list"
      text: ["VPC"]
      not_text: ["오류가 발생", "권한이 없습니다"]

  - goal: "VPC 생성 버튼을 눌러 생성 화면을 연다"
    expect:
      title_contains: "생성"
      text: ["VPC"]

  - goal: "VPC 이름에 {{name}} 을 입력하고, IP 대역(CIDR)이 필요하면 {{cidr}} 를 입력하고, 나머지는 기본값으로 두고 생성 버튼을 눌러 생성을 완료한다"
    vars:
      # VPC명은 최대 20자 (콘솔 입력란 20/20). run_id 가 14자이므로 접두어는 6자 이하.
      name: "vpc-{{run_id}}"
      cidr: "10.250.0.0/16"
      description: "자동 테스트 {{run_id}}"
    expect:
      url: "#/vpc/vpc/list"
      text: ["{{name}}"]
      not_text: ["오류가 발생", "실패"]
      timeout: 60000

  # 동작(L3, 2026-10-13 6E, API setvpc): 상세 "설명" 연필 → 모달 → 확인 → 반영 → 원래 값으로 되돌림. 상세 버튼·연필 라벨은 로그로 남긴다(addvpccidr 진입점 확인용).
  - goal: "VPC {{name}} 상세에서 설명을 바꿔 반영을 확인하고 되돌린다 (L3)"
    expect:
      url: "#/vpc/vpc/detail"
      text: ["{{name}}"]

  # 동작(L3, 2026-10-16 에이전트 A, API addvpccidr): 상세 탭 "IP 대역 관리 (n)" (#/vpc/vpc/detail/ip-range) → 버튼 "IP 대역 추가" → 모달 "IP 대역 추가"
  # (입력란 1개, CIDR /16~/28, 관리용·Peering·DC·TGW·Private NAT 대역과 중복 불가) → "확인" → 탭 표(IP 대역 | 생성 일시)에 행 추가.
  # 10.251/10.252 는 관리용으로 막힌다 → 192.168.100.0/24. 2026-10-16 프로브 기준 표에 행 버튼·선택 아이콘이 없어 삭제 진입점은 미확인(spec 이 있으면 지우고, 없으면 로그만; VPC 해지가 함께 지운다).
  - goal: "VPC {{name}} 상세 IP 대역 관리 탭에서 IP 대역 {{cidr2}} 를 추가하고 표에 보이는지 확인한다 (L3)"
    vars:
      cidr2: "192.168.100.0/24"
    expect:
      url: "#/vpc/vpc/detail/ip-range"
      text: ["{{cidr2}}"]

  - goal: "추가한 IP 대역 {{cidr2}} 를 삭제한다 (삭제 진입점이 있을 때만; 없으면 로그로 남기고 건너뛴다)"
    expect:
      url: "#/vpc/vpc/detail/ip-range"

teardown:
  - goal: "VPC 목록 화면으로 이동한다"
    goto: "#/vpc/vpc/list"
    expect:
      url: "#/vpc/vpc/list"
      text: ["VPC"]

  # 콘솔의 삭제 버튼 라벨은 "서비스 해지" (행 끝 버튼, 또는 행 선택 후 상단 버튼). 안전장치는 goal 에 "해지" 가 있어야 그 버튼을 후보에 넣는다.
  # 이름 링크를 누르면 상세 화면으로 가 버리므로 goal 에서 링크는 누르지 말라고 명시한다.
  - goal: "목록에서 {{name}} 행의 서비스 해지 버튼을 누르고, 확인 창이 뜨면 확인을 눌러 해지를 확정한다 (이름 링크는 누르지 않는다)"
    expect:
      not_text: ["{{name}}"]
      timeout: 120000
