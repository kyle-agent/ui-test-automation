id: smoke.quota-service
title: "Quota Service 화면 진입 스모크 (읽기 전용)"
service: "Quota Service"
category: "Management"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Management > Quota Service 를 열어 서비스에 진입한다"
    expect:
      url: "#/quota"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Quota Service 을(를) 클릭한다"
    expect:
      url: "#/quota/service/list"
      text: ["Quota Service"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 요청 내역 을(를) 클릭한다"
    expect:
      url: "#/quota/request-history"
      text: ["요청 내역"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 조직 할당량 템플릿 을(를) 클릭한다"
    expect:
      url: "#/quota/template"
      text: ["조직 할당량 템플릿"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
