id: iam.role
title: IAM 역할 생성 후 삭제
service: IAM
category: Management
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-29 프로브): 목록 #/iam/role (Global), 버튼 "역할 생성" / 상단 "삭제"(행 선택 후). 기존 OrganizationAccountAccessRole 은 건드리지 않는다.
# 폼 #/iam/role/create: "역할명"(영문·숫자·+=,.@-_ 64자 이내), 설명, 최대 세션 지속 시간(1시간), 수행 주체 연결(구분 "현재 Account" 를 고르면 Value 에 계정 ID 가 채워진다),
# 정책 연결(선택 사항), 태그. "추가" 는 수행 주체 행을 하나 더 만든다: 빈 행이 남으면 생성이 비활성이라 누르지 않는다.
# 정책 없이 현재 Account 만 수행 주체로 둔 역할이라 권한 영향이 없다. 무과금.
steps:
  - goal: "역할 목록으로 이동한다"
    goto: "#/iam/role"
    expect:
      url: "#/iam/role"

  - goal: "역할 {{name}} 을 수행 주체 현재 Account, 정책 없이 생성한다"
    vars:
      name: "role-{{run_id}}"
    expect:
      url: "#/iam/role"
      text: ["{{name}}"]

  # 동작(L3, 2026-10-06): 상세 탭 정책(n)·수행 주체(n)·태그(n), 기본 정보 "최대 세션 지속 시간" 연필.
  - goal: "정책 탭에서 기본 정책 CostNavigatorReadOnlyAccess 를 연결했다가 연결 해제한다"
    expect:
      url: "#/iam/role/"
      text: ["정책(0)"]

  - goal: "수행 주체에 서비스 cloudscope.samsungsdscloud.com 을 추가했다가 제거한다"
    expect:
      url: "#/iam/role/"
      text: ["수행 주체(1)"]
      not_text: ["cloudscope.samsungsdscloud.com"]

  - goal: "최대 세션 지속 시간을 1시간 → 2시간으로 수정하고 상세에 반영됐는지 확인한다"
    expect:
      url: "#/iam/role/"
      text: ["2시간"]

  - goal: "태그 탭에서 태그 qa-tag={{run_id}} 를 추가했다가 삭제한다"
    expect:
      url: "#/iam/role/"
      text: ["태그(0)"]

  # agent C(2026-10-16): 목록 "삭제" 는 bulk API(deletebulkrole)라 단건 deleterole 은 상세 상단 "역할 삭제" 로만 나간다 → 두 번째 역할을 만들어 상세에서 지운다.
  - goal: "역할 {{name2}} 를 같은 조건으로 만들고 상세 상단 '역할 삭제' 로 삭제한다"
    vars:
      name2: "role2-{{run_id}}"
    expect:
      url: "#/iam/role"
      not_text: ["{{name2}}"]
      timeout: 120000

teardown:
  - goal: "역할 {{name}} 을 삭제한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 120000
