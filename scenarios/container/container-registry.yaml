id: container.container-registry
title: Container Registry 생성 후 해지
service: Container Registry
category: Container
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-29 프로브): 목록 #/scr/registry, 버튼 "서비스 생성". 목록에 해지 버튼이 없어 상세에서 "서비스 해지".
# 폼 #/scr/registry/request: "레지스트리명"(영문 소문자로 시작, 소문자·숫자 3~25자, '-' 불가), 엔드포인트 프라이빗(기본),
# 프라이빗 엔드포인트 접근 제어(끔), 가시성 Public(끔), 태그. 선행 리소스 없음. 저장 용량 과금이라 비어 있는 채로 바로 해지.
steps:
  - goal: "Registry 목록으로 이동한다"
    goto: "#/scr/registry"
    expect:
      url: "#/scr/registry"

  - goal: "Registry {{name}} 을 프라이빗 엔드포인트로 생성한다"
    vars:
      name: "cr{{run_id_compact}}"
    expect:
      url: "#/scr/registry"
      text: ["{{name}}"]

  # 동작(L3, 2026-10-06): 상세 "엔드포인트" 연필(Editing ≈1~2분 → Running), 태그 탭.
  - goal: "엔드포인트를 프라이빗 → 프라이빗&퍼블릭으로 바꿔 퍼블릭 엔드포인트가 생기는지 보고 프라이빗으로 되돌린다"
    expect:
      url: "#/scr/registry/detail"
      text: ["프라이빗"]

  - goal: "태그 탭에서 태그 qa-tag={{run_id}} 를 추가했다가 삭제한다"
    expect:
      url: "#/scr/registry/detail"
      text: ["태그 (0)"]

teardown:
  - goal: "Registry {{name}} 을 해지한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 120000
