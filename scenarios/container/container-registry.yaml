id: container.container-registry
title: Container Registry 생성 후 해지
service: Container Registry
category: Container
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-29 프로브): 목록 #/scr/registry, 버튼 "서비스 생성". 목록에 해지 버튼이 없어 상세에서 "서비스 해지".
# 폼 #/scr/registry/request: "레지스트리명"(영문 소문자로 시작, 소문자·숫자 3~25자, '-' 불가), 엔드포인트 프라이빗(기본),
# 프라이빗 엔드포인트 접근 제어(끔), 가시성 Public(끔), 태그. 선행 리소스 없음. 저장 용량 과금이라 비어 있는 채로 바로 해지.
steps:
  - goal: "Registry 목록으로 이동한다"
    goto: "#/scr/registry"
    expect:
      url: "#/scr/registry"

  - goal: "Registry {{name}} 을 프라이빗 엔드포인트로 생성한다"
    vars:
      name: "cr{{run_id_compact}}"
    expect:
      url: "#/scr/registry"
      text: ["{{name}}"]

  # 접근 제어(2026-10-16, 에이전트 B): 상세 "프라이빗 엔드포인트 접근 제어" 연필 → 모달(사용 체크 · 프라이빗 접근 허용 리소스 표 + "추가") → 확인 → "수정한 정보를 저장하시겠습니까?"
  # → PUT /container-registries/{id}/private-acl (updateprivateacl). 허용 리소스 0개여도 사용 ↔ 미사용 전환은 저장된다. 라벨에 안내 아이콘(i-info)이 함께 있어 ^…$ 정규식으로는 라벨을 못 찾는다(10-07 "연필이 열리지 않음" 의 원인).
  # (라벨 글자 사이 공백이 일반 공백이 아니라 text 판정에 라벨 문구를 쓰지 않는다)
  - goal: "프라이빗 엔드포인트 접근 제어를 사용 → 미사용 → 사용으로 바꾼다"
    expect:
      url: "#/scr/registry/detail"
      text: ["{{name}}"]

  - goal: "태그 탭에서 태그 qa-tag={{run_id}} 를 추가했다가 삭제한다"
    expect:
      url: "#/scr/registry/detail"
      text: ["태그 (0)"]

  # 동작(L3, 2026-10-06): 상세 "엔드포인트" 연필(Editing ≈1~2분 → Running). 퍼블릭을 켠 동안만 "퍼블릭 엔드포인트 접근 제어" 연필이 보인다(2026-10-16):
  # 모달(사용 체크 · 퍼블릭 접근 허용 IP 입력 + "추가"(최대 100) · "전체 삭제" · 퍼블릭 접근 허용 리소스 표) → 확인 → "수정한 정보를 저장하시겠습니까?" → PUT …/public-acl (updatepublicacl), 상세 "퍼블릭 접근 허용 IP 총 1 192.0.2.10/32".
  # 프라이빗으로 되돌리기는 KI-001(data/known-issues.yaml, 10-14~)로 반영되지 않는다 — 2026-10-16 프로브에서도 재현. 그래서 이 단계를 마지막에 둔다.
  - goal: "엔드포인트를 프라이빗 → 프라이빗&퍼블릭으로 바꿔 퍼블릭 엔드포인트가 생기는지 보고, 퍼블릭 접근 허용 IP 192.0.2.10/32 를 추가한 뒤 프라이빗으로 되돌린다"
    expect:
      url: "#/scr/registry/detail"
      text: ["프라이빗"]

teardown:
  - goal: "Registry {{name}} 을 해지한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 120000
