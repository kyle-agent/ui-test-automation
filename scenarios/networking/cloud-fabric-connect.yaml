id: networking.cloud-fabric-connect
title: Cloud Fabric Connect Fabric·Policy·Connection 생성 후 해지
service: Cloud Fabric Connect
category: Networking
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-10-06 프로브, recordings/probe/cfc-fabric.md): Global 화면. 목록 #/cfc/fabric, 버튼 "서비스 생성", 행 끝 "서비스 해지".
# 폼 #/cfc/fabric/new: "Fabric명"(영문·숫자 3~20자) · Location(Gasan 기본 · Pyeongchon) · 설명 · 태그. 요금 확인 버튼 없음. 생성 즉시 Active.
# Policy(#/cfc/policy): Fabric명(항목 "<이름> (Gasan)") · Policy명 만. Port(1G/10G 물리 포트, 이중화)는 회선이라 만들지 않는다.
# API 자동화에는 Cloud Fabric Connect 엔드포인트가 없다 → 콘솔 프로브로 판단.
steps:
  - goal: "Fabric 목록으로 이동한다"
    goto: "#/cfc/fabric"
    expect:
      url: "#/cfc/fabric"

  - goal: "Fabric {{name}} 을 Location Gasan 으로 생성한다"
    vars:
      name: "cfc{{run_id_compact}}"
      policy: "cfp{{run_id_compact}}"
      connection: "cfn{{run_id_compact}}"
    expect:
      url: "#/cfc/fabric"
      text: ["{{name}}"]

  - goal: "Fabric {{name}} 에 Policy {{policy}} 를 만들고 목록 확인 뒤 삭제한다"
    expect:
      url: "#/cfc/policy"
      not_text: ["{{policy}}"]

  - goal: "Fabric {{name}} 에 Connection {{connection}}(구성 방식 기본값)을 만들고 목록 확인 뒤 삭제한다"
    expect:
      url: "#/cfc/connection"
      not_text: ["{{connection}}"]

teardown:
  - goal: "Fabric {{name}} 을 해지한다"
    expect:
      not_text: ["{{name}}"]
      timeout: 300000
