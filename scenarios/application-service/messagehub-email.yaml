id: application-service.messagehub-email
title: Message Hub 발신 Email 주소 등록 후 삭제 (인증 메일 없이)
service: Message Hub
category: Application Service
tags: [regression, destructive, crud]
precondition:
  session: root
  region: kr-west1
  language: ko
  cleanup: true

# 콘솔(2026-09-29 프로브, recordings/probe/messagehub-email.md): 목록 #/messagehub/email (메뉴 Email 관리 > Email), 버튼 "Email 추가".
# 폼 #/messagehub/email/request: "Email Address"(254자), 설명 → "완료" → "Email을 추가하시겠습니까?" 확인. 등록 직후 인증 상태 "확인 필요".
# 목록의 주소는 앞 3글자만 남기고 가려진다("mhe***@*******.com") → 검색창("Email Address를 입력하세요.")에 전체 주소를 넣어 걸러 행을 찾고,
# 상세(#/messagehub/email/detail/info?emailId=…) 제목·"Email Address" 에서 전체 주소를 확인한 뒤 상세 "Email 삭제".
# 상세의 "Email 인증" 을 눌러야 인증 메일이 나간다 → 누르지 않는다. 주소는 예약 도메인 example.com(수신 서버 없음). 무과금.
steps:
  - goal: "Email 목록으로 이동한다"
    goto: "#/messagehub/email"
    expect:
      url: "#/messagehub/email"

  - goal: "발신 Email {{name}} 을 등록하고 상세에서 전체 주소를 확인한다"
    vars:
      name: "mhe-{{run_id}}@example.com"
    expect:
      text: ["{{name}}", "확인 필요"]

teardown:
  - goal: "Email {{name}} 을 삭제한다"
    expect:
      url: "#/messagehub/email"
      not_text: ["{{name}}"]
      timeout: 120000
