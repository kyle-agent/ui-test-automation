id: smoke.devops-service
title: "DevOps Service 화면 진입 스모크 (읽기 전용)"
service: "DevOps Service"
category: "DevOps Tools"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 DevOps Tools > DevOps Service 를 열어 서비스에 진입한다"
    expect:
      url: "#/devopsservice/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 DevOps Service 을(를) 클릭한다"
    expect:
      url: "#/devopsservice/devops-service"
      text: ["DevOps Service"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
