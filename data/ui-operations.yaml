  createsubnet: networking.vpc-port, networking.nat-gateway, networking.privatelink-service, networking.vpc-endpoint, networking.load-balancer, compute.vm-stack, compute.vm-stack-net, compute.vm-volume, compute.auto-scaling-group, container.ske-cluster, container.ske-upgrade, data-analytics.event-streams, database.cachestore, database.epas, database.mariadb, database.mysql, database.postgresql
  deletesubnet: networking.vpc-port, networking.nat-gateway, networking.privatelink-service, networking.vpc-endpoint, networking.load-balancer, compute.vm-stack, compute.vm-stack-net, compute.vm-volume, compute.auto-scaling-group, container.ske-cluster, container.ske-upgrade, data-analytics.event-streams, database.cachestore, database.epas, database.mariadb, database.mysql, database.postgresql
  createinternetgateway: networking.firewall, networking.vpc-port, networking.vpn, networking.load-balancer, compute.vm-stack-net
  deleteinternetgateway: networking.firewall, networking.vpc-port, networking.vpn, networking.load-balancer, compute.vm-stack-net
  createpublicip: networking.nat-gateway, networking.vpc-port, networking.vpn, networking.load-balancer, compute.vm-stack-net
  deletepublicip: networking.nat-gateway, networking.vpc-port, networking.vpn, networking.load-balancer, compute.vm-stack-net
  createnatgateway: networking.nat-gateway
  deletenatgateway: networking.nat-gateway
  setnatgateway: networking.nat-gateway  # 실측: 상세(이름 NAT_GW_<subnet>) 설명 연필 → PUT /v1/nat-gateways/{id} (6E 10-13)
  createport: networking.vpc-port
  deleteport: networking.vpc-port
  # 6E 10-13 실측: 각 상세 "설명" 연필 → 수정 → 되돌림 (networking.vpc-port steps[8]·[11])
  setsubnet: networking.vpc-port  # PUT /v1/subnets/{id}
