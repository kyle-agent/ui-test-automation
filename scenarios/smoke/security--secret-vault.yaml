id: smoke.secret-vault
title: "Secret Vault 화면 진입 스모크 (읽기 전용)"
service: "Secret Vault"
category: "Security"
tags: [smoke, readonly, generated]
precondition:
  session: root
  region: kr-west1
  language: ko
steps:
  - goal: "모든 서비스에서 Security > Secret Vault 를 열어 서비스에 진입한다"
    expect:
      url: "#/secretvault/dashboard"
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
  - goal: "좌측 메뉴에서 Secret Vault 을(를) 클릭한다"
    expect:
      url: "#/secretvault/secretvault/list"
      text: ["Secret Vault"]
      not_text: ["오류가 발생", "Error", "권한이 없습니다"]
